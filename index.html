<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Montserrat',Arial,sans-serif;background:#f5f7fa;color:#211E1E}
  .bh-topbar{height:4px;background:#ED2B30;width:100%}
  .bh-banner{background:#fff;border-bottom:1px solid #E8E6E7;width:100%}
  .bh-banner-inner{max-width:1300px;margin:0 auto;padding:12px 20px 14px;display:flex;align-items:center;gap:18px}
  .bh-logo{height:54px;width:auto;flex:none}
  .bh-title{color:#211E1E;font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .bh-sub{color:#5b6472;font-size:12.5px;margin-top:3px}
  .bh-badge{margin-left:auto;border:1px solid #1a7f37;color:#1a7f37;background:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:bold;letter-spacing:.05em;white-space:nowrap}
  .wrap{max-width:1300px;margin:0 auto;padding:20px}
  .banner{background:#fff7e6;border:1px solid #f0d089;color:#7a5a12;padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .err{background:#FFC7CE;border-color:#e6a3a3;color:#9C0006}
  #map{height:380px;border-radius:12px;border:1px solid #e3e8f0;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .controls label{font-size:13px;color:#40485a;font-weight:bold}
  select,input[type=text]{padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;font-size:14px;background:#fff}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:13px 15px;cursor:pointer}
  .card .n{font-size:24px;font-weight:bold}.card .l{font-size:11px;color:#5b6472;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .card.total .n{color:#7F1B29}.card.soon .n{color:#9a6a00}.card.ok .n{color:#1a7f37}.card.rfi .n{color:#1a4fb0}.card.co .n{color:#484B4D}.card.nc .n{color:#b3261e}
  .card.sel{outline:2px solid #ED2B30;outline-offset:-2px}.card.clk{cursor:pointer}.card.noclk{cursor:default}
  .pcard{background:#fff;border:1px solid #e3e8f0;border-left:6px solid #484B4D;border-radius:10px;padding:12px 16px;margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .pcard.g{border-left-color:#1a7f37}.pcard.y{border-left-color:#c99a00}.pcard.r{border-left-color:#b3261e}
  .phead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .pname{font-weight:bold;font-size:15px;color:#211E1E}
  .pname a{color:inherit;text-decoration:none}.pname a:hover{color:#ED2B30;text-decoration:underline}
  .pnum{font-size:12px;color:#5b6472}
  .chip{padding:1px 8px;border-radius:999px;font-size:10px;font-weight:bold;white-space:nowrap}
  .chip.stage{background:#eef2f8;color:#1F3864;border:1px solid #cfe0f3}
  .chip.sect{background:#f1efe9;color:#6a5a3a;border:1px solid #e2d9c7}
  .chip.close{background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e}
  .chip.sp{background:#ECE7F5;color:#4a2f7a;border:1px solid #d6c8ee}
  .pright{margin-left:auto;display:flex;gap:8px;align-items:center}
  .pill{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:bold}
  .pill.g{background:#C6EFCE;color:#006100}.pill.y{background:#FFEB9C;color:#9C6500}.pill.r{background:#FFC7CE;color:#9C0006}.pill.n{background:#eef1f6;color:#8a92a1}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 18px;margin-top:9px;font-size:12.5px}
  .pgrid .k{color:#7a828f;font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;font-weight:700}
  .pgrid .v{color:#2b3240}
  .team{margin-top:8px;font-size:12px;color:#40485a;border-top:1px solid #f0f2f6;padding-top:7px}
  .team b{color:#211E1E}
  .money{font-variant-numeric:tabular-nums}
  .over{color:#b3261e;font-weight:bold}.under{color:#1a7f37;font-weight:bold}
  .srclinks{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .srclinks a{font-size:11px;color:#484B4D;border:1px solid #cfd6e0;border-radius:6px;padding:2px 8px;text-decoration:none;background:#fff}
  .srclinks a:hover{background:#484B4D;color:#fff}
  .empty{color:#5b6472;font-style:italic;padding:16px 0}
  .loading{padding:40px;text-align:center;color:#5b6472}
  footer{margin-top:26px;font-size:11.5px;color:#8a92a1;border-top:1px solid #e3e8f0;padding-top:12px;line-height:1.5}
  .tabs{display:flex;gap:2px;border-bottom:2px solid #e3e8f0;margin-bottom:16px}
  .tab{padding:9px 20px;font-size:14px;font-weight:700;color:#5b6472;cursor:pointer;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit}
  .tab.active{color:#ED2B30;border-bottom-color:#ED2B30}
  .panel{display:none}.panel.active{display:block}
  .ms{position:relative;display:inline-block}
  .ms-btn{padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;min-width:190px;text-align:left;font-family:inherit}
  .ms-btn:after{content:'▾';float:right;color:#8a92a1}
  .ms-panel{position:absolute;z-index:1000;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #c7cfdb;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:8px;width:320px;max-height:340px;overflow:auto;display:none}
  .ms-panel.open{display:block}
  .ms-tools{display:flex;gap:8px;margin-bottom:6px}
  .ms-tools button{font-size:11px;padding:3px 9px;border:1px solid #cfd6e0;border-radius:6px;background:#f5f7fa;cursor:pointer;font-family:inherit}
  .ms-search{width:100%;margin-bottom:6px}
  .ms-item{display:flex;align-items:center;gap:7px;padding:3px 4px;font-size:12.5px;cursor:pointer;border-radius:4px}
  .ms-item:hover{background:#f5f7fa}
  .fover{color:#b3261e;font-weight:bold}.funder{color:#1a7f37;font-weight:bold}
  .pcard.fin{border-left-color:#484B4D}.pcard.fin.o{border-left-color:#b3261e}.pcard.fin.u{border-left-color:#1a7f37}
  .varbox{background:#fff;border:1px solid #e3e8f0;border-left:5px solid #b3261e;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px}
  .varbox.clean{border-left-color:#1a7f37}
  .varbox b{color:#211E1E}
  .pgrid .k.tip{border-bottom:1px dotted #aab2be;cursor:help}
  .card[title]{cursor:help}
  .fnote{font-size:12.5px;color:#40485a;background:#f0f4fa;border:1px solid #d5e0f0;border-radius:8px;padding:9px 13px;margin-bottom:14px}
  .rwrap{overflow-x:auto;border:1px solid #e3e8f0;border-radius:10px;background:#fff}
  .rtable{width:100%;border-collapse:collapse;font-size:12.5px}
  .rtable th,.rtable td{padding:7px 10px;border-bottom:1px solid #eef1f6;text-align:right;white-space:nowrap}
  .rtable th{position:sticky;top:0;background:#f7f9fc;color:#7a828f;font-size:10px;text-transform:uppercase;letter-spacing:.02em}
  .rtable td.l,.rtable th.l{text-align:left}
  .rtable tr.miss td{background:#fff5f5}.rtable tr.nce td{background:#fffaf0}.rtable tr.eacw td{background:#fff8ec}
  .rdelta.d{color:#b3261e;font-weight:bold}.rdelta.z{color:#1a7f37}
  .rstat.ok{color:#1a7f37;font-weight:bold}.rstat.bad{color:#b3261e;font-weight:bold}.rstat.warn{color:#9a6a00;font-weight:bold}
  /* keep pills/chips/number tiles from overflowing */
  .pill,.chip{white-space:nowrap;flex:none}
  .pright{flex-wrap:wrap;justify-content:flex-end;max-width:100%}
  .card{overflow:hidden}
  .card .n{line-height:1.12}
  /* ---------------- mobile ---------------- */
  @media (max-width:680px){
    .wrap{padding:12px}
    .bh-banner-inner{gap:10px;padding:10px 12px 12px}
    .bh-logo{height:40px}.bh-title{font-size:18px}.bh-sub{font-size:11px}
    #map{height:260px;margin-bottom:14px}
    .controls{gap:8px}.controls label{font-size:12px}
    select,input[type=text]{font-size:13px;padding:7px 9px}
    #q{min-width:0;flex:1 1 100%;width:100%}
    .cards{grid-template-columns:1fr 1fr;gap:8px}
    .card{padding:10px 11px}.card .n{font-size:16px}
    .pcard{padding:11px 13px}
    .pgrid{grid-template-columns:1fr 1fr;gap:6px 14px}
    .phead{gap:6px}
    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
    .tab{padding:8px 13px;font-size:13px;white-space:nowrap;flex:none}
    .ms-panel{width:min(300px,86vw)}
    .banner,.fnote{font-size:12px}
  }
  @media (max-width:420px){ .cards{grid-template-columns:1fr 1fr}.pgrid{grid-template-columns:1fr} }
</style>

async function getToken(){ await msalApp.initialize(); const redir=await msalApp.handleRedirectPromise(); let acct=(redir&&redir.account)||msalApp.getAllAccounts()[0]; if(!acct){ await msalApp.loginRedirect({scopes:SCOPES}); return null;} msalApp.setActiveAccount(acct); try{const t=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return t.accessToken;}catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES});return null;} }

/* ---------- projection model (percent-complete, live/current) ----------
   Fee = Margin = Profit = Contract − Projected Cost (EAC).
   % complete = Cost-to-Date ÷ EAC ; Revenue Recognized = %×Contract ;
   Remaining Revenue (backlog) = Contract − Recognized ; spread straight-line
   over Months-to-Complete (now → projected completion). */
function projOf(r){
  const c=r.ce; if(!c) return null;
  const contract=num(c.ce_contract)||num(r.revised_contract)||num(r.contract_amount);
  const eac=num(c.ce_projected_cost), cost=num(c.ce_actual_cost);
  const margin=contract-eac, pct=eac?cost/eac:0;
  const revRec=contract*pct, remaining=contract-revRec;
  let months=null; const compl=r.completion_date?new Date(r.completion_date):null; const now=new Date();
  if(compl&&!isNaN(compl.getTime())) months=Math.max(0,(compl.getFullYear()-now.getFullYear())*12+(compl.getMonth()-now.getMonth()));
  const monthly=(months!=null)?remaining/(months+1):null;
  return {contract,eac,cost,margin,marginPct:contract?margin/contract*100:null,pct:pct*100,revRec,remaining,months,monthly,compl};
}
function monthLabels(n){ const out=[]; const t=new Date(); for(let i=0;i<n;i++){ const d=new Date(t.getFullYear(),t.getMonth()+i,1); out.push(d.toLocaleString(undefined,{month:'short',year:'2-digit'})); } return out; }
async function fetchFile(token, path){
  const H={Authorization:'Bearer '+token};
  try{ const s=await fetch('https://graph.microsoft.com/v1.0/sites/'+SITE_PATH,{headers:H});
    if(s.ok){ const sid=(await s.json()).id;
      const r=await fetch('https://graph.microsoft.com/v1.0/sites/'+sid+'/drive/root:/'+encodeURI(path)+':/content',{headers:H});
      if(r.ok) return r; } }catch(e){}
  return fetch('https://graph.microsoft.com/v1.0/drives/'+DRIVE_ID+'/root:/'+encodeURI(path)+':/content',{headers:H});
}
async function load(){
  try{
    const token=await getToken(); if(!token) return;
    const res=await fetchFile(token, PROJECTS_PATH);
    if(!res.ok) throw new Error('Graph HTTP '+res.status+' (need access to projects_data.json)');
    const data=await res.json();
    ROWS=(data.projects||[]).filter(r=>!/\bFY\s?\d{2,4}\b/i.test((r.project||'')+' '+(r.project_number||'')));  // drop internal FY-tracking projects
    GENERATED=data.generated_at||'';
    // CE WIP data (best-effort) — merge by job_code = project_number
    try{ const cr=await fetchFile(token, CE_PATH);
      if(cr.ok){ const cd=await cr.json(); const cem={}; for(const j of (cd.jobs||[])) cem[String(j.job_code)]=j;
        for(const r of ROWS){ r.ce=cem[String(r.project_number)]||null;
          const pc=num(r.revised_contract||r.contract_amount), cc=r.ce?num(r.ce.ce_contract):0;
          r.markup_gap=(r.ce && (pc-cc)>1000)?(pc-cc):0;   // Procore contract > CE = fee/markup not synced (Spark) -> CE margin/projection understated
          // EAC not synced: Procore Cost-Projections EAC vs CE's imported EAC (Enter Revised Estimates) differ materially
          const pE=num(r.projected_cost), cE=r.ce?num(r.ce.ce_projected_cost):0, eacTol=Math.max(5000, pE*0.01);
          r.eac_gap=(r.ce && pE>0 && cE>0 && Math.abs(pE-cE)>eacTol)?(pE-cE):0;
        }
        CE_GENERATED=cd.generated_at||''; }
    }catch(e){}
    // Monthly reviewed snapshots (best-effort; tab shows an empty state until the first month is imported)
    try{ const mr=await fetchFile(token, PROJSNAP_PATH); if(mr.ok){ MONTHLY=await mr.json(); } }catch(e){ MONTHLY=null; }
    try{ const hr=await fetchFile(token, CEHIST_PATH); if(hr.ok){ CEHIST=await hr.json(); } }catch(e){ CEHIST=null; }
    document.getElementById('asof').textContent=GENERATED?('data as of '+new Date(GENERATED).toLocaleString()+(CE_GENERATED?' · CE '+new Date(CE_GENERATED).toLocaleString():'')):'';
    buildUI();
  }catch(e){ const b=document.getElementById('banner'); b.style.display='block'; b.className='banner err'; b.textContent='Sign-in or data load failed: '+(e&&e.message||e); document.getElementById('content').innerHTML=''; }
}

function allStages(){ return [...new Set(ROWS.map(r=>r.stage).filter(Boolean))].sort(); }
function stRebuild(){
  document.getElementById('stList').innerHTML = allStages().map(s=>{
    const on=STAGES_SEL?STAGES_SEL.has(s):true;
    return '<label class="ms-item"><input type="checkbox" data-stage="'+esc(s)+'"'+(on?' checked':'')+'><span>'+esc(s)+'</span></label>'; }).join('');
  document.querySelectorAll('#stList input[type=checkbox]').forEach(cb=>cb.addEventListener('change',stToggle));
}
function stToggle(e){
  const s=e.target.getAttribute('data-stage'); const all=allStages();
  if(STAGES_SEL===null) STAGES_SEL=new Set(all);
  if(e.target.checked) STAGES_SEL.add(s); else STAGES_SEL.delete(s);
  if(all.every(x=>STAGES_SEL.has(x))) STAGES_SEL=null;
  updateStBtn(); onStruct();
}
function updateStBtn(){
  const all=allStages(), n=all.length;
  const sel=STAGES_SEL?[...STAGES_SEL].filter(s=>all.includes(s)).length:n;
  document.getElementById('stBtn').textContent=(STAGES_SEL===null||sel===n)?'All stages ('+n+')':(sel+' of '+n+' stages');
}

/* ---------- filtering ---------- */
function structFiltered(){
  const fS=fSector.value,fO=fOffice.value,fF=fFlag.value;
  let v=ROWS.filter(r=>(!fS||r.sector===fS)&&(STAGES_SEL?STAGES_SEL.has(r.stage):true)&&(!fO||r.office===fO));
  if(fF==='close') v=v.filter(r=>r.closing_this_month);
  else if(fF==='fc') v=v.filter(r=>r.compliance&&r.compliance.fully_compliant);
  else if(fF==='nc') v=v.filter(r=>r.compliance&&r.compliance.noncompliant>0);
  else if(fF==='rfi') v=v.filter(r=>r.rfis_open>0);
  else if(fF==='over') v=v.filter(r=>r.projected_cost&&r.projected_margin<0);
  return v;
}

const TR_PALETTE=['#2563eb','#16a34a','#d97706','#9333ea','#dc2626','#0891b2','#ca8a04','#db2777','#4f46e5','#059669'];
function renderTrends(){
  const cards=document.getElementById('trCards'), listEl=document.getElementById('trList'), note=document.getElementById('trNote'), titleEl=document.getElementById('trChartTitle');
  if(!cards) return;
  const isBill=TRMETRIC==='billings';

  const metricLabel=isBill?'Billings':'Cost';
  const snaps=(CEHIST&&CEHIST.snapshots)||{};
  const months=((CEHIST&&CEHIST.months)||Object.keys(snaps)).slice().sort();
  const secOf={}; ROWS.forEach(r=>{ secOf[String(r.project_number)]=r.sector||'Unclassified'; });
  note.textContent=isBill
    ? 'Billings/month = change in CE amount billed to owner between consecutive month-end captures.'
    : 'Cost/month = change in CE actual cost between consecutive month-end captures.';
  if(months.length<2){
    cards.innerHTML=''; if(TRCHART){ try{TRCHART.destroy();}catch(e){} TRCHART=null; }
    listEl.innerHTML='<div class="empty">Not enough monthly CE history to chart trends yet. Each CE WIP pull captures one month into <b>ce_history.json</b>; after a couple of month-end runs, month-over-month '+metricLabel.toLowerCase()+' per job type will appear here.'+(months.length?' (Have '+months.length+' month so far.)':'')+'</div>';
    return;
  }
  // cumulative value per job per month
  const cum={}; months.forEach(ym=>{ const m={}; ((snaps[ym]&&snaps[ym].jobs)||[]).forEach(j=>{ m[String(j.job_code)]=num(j[field]); }); cum[ym]=m; });
  const deltaMonths=months.slice(1);
  // aggregate per sector per delta-month
  const secTot={}, secCnt={};   // sector -> [per delta month]
  const seenSec=new Set();
  deltaMonths.forEach((ym,i)=>{
    const cur=cum[ym], prev=cum[months[i]];
    const codes=new Set([...Object.keys(cur),...Object.keys(prev)]);
    const tThis={}, cThis={};
    codes.forEach(jc=>{ const d=(cur[jc]||0)-(prev[jc]||0); if(!d) return; const s=secOf[jc]||'Unclassified'; tThis[s]=(tThis[s]||0)+d; cThis[s]=(cThis[s]||0)+1; seenSec.add(s); });
    // stash this month's maps for second pass
    (secTot.__rows=secTot.__rows||[]).push(tThis); (secCnt.__rows=secCnt.__rows||[]).push(cThis);
  });
  const sectors=[...seenSec].sort();
  const rowsT=secTot.__rows, rowsC=secCnt.__rows;
  const series={};   // sector -> {total:[],avg:[]}
  sectors.forEach(s=>{ series[s]={total:deltaMonths.map((_,i)=>rowsT[i][s]||0), avg:deltaMonths.map((_,i)=>{ const c=rowsC[i][s]||0; return c?(rowsT[i][s]||0)/c:0; })}; });

  const compTotal=deltaMonths.map((_,i)=>sectors.reduce((a,s)=>a+(rowsT[i][s]||0),0));
  const compCnt=deltaMonths.map((_,i)=>sectors.reduce((a,s)=>a+(rowsC[i][s]||0),0));
  const compBasis=deltaMonths.map((_,i)=>TRBASIS==='avg'?(compCnt[i]?compTotal[i]/compCnt[i]:0):compTotal[i]);
  // ---- summary cards: latest delta-month per sector + Δ vs prior delta-month ----
  const li=deltaMonths.length-1, pi=li-1;
  const basisWord=TRBASIS==='avg'?'avg/job':'total';
  const lastMonthName=monthName(deltaMonths[li]);
  let cardsHtml=card('total',money(TRBASIS==='avg'?(compCnt[li]?compTotal[li]/compCnt[li]:0):compTotal[li]),metricLabel+' '+lastMonthName+' ('+basisWord+')',null,'Company-wide '+metricLabel.toLowerCase()+' in '+lastMonthName+' ('+basisWord+').');
  const topSecs=sectors.slice().sort((a,b)=>Math.abs(basisArr(b)[li])-Math.abs(basisArr(a)[li])).slice(0,4);
  topSecs.forEach(s=>{ const v=basisArr(s)[li], pv=pi>=0?basisArr(s)[pi]:null, dv=pv!=null?v-pv:null;
    const sub=dv!=null?(' · '+(dv>=0?'▲':'▼')+' '+money(Math.abs(dv))+' vs prior'):'';
    cardsHtml+=card(dv==null?'total':(dv>=0?'ok':'soon'),money(v),esc(s)+' — '+lastMonthName,null,s+' '+metricLabel.toLowerCase()+' ('+basisWord+') for '+lastMonthName+sub)+''; });
  cards.innerHTML=cardsHtml;
  // ---- chart ----
  titleEl.textContent=metricLabel+' per month by job type — '+(TRBASIS==='avg'?'average per active job':'total per type');
  if(window.Chart){
    const ctx=document.getElementById('trChart'); if(ctx){ if(TRCHART){ try{TRCHART.destroy();}catch(e){} }
      const ds=sectors.map((s,i)=>({label:s,data:basisArr(s),borderColor:TR_PALETTE[i%TR_PALETTE.length],backgroundColor:'transparent',tension:0.4,borderWidth:2,pointRadius:2,fill:false}));
      TRCHART=new Chart(ctx,{type:'line',data:{labels:deltaMonths.map(monthName),datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+money(c.parsed.y)}}},scales:{y:{ticks:{callback:v=>money(v)}}}}});
    }
  }
  // ---- table ----
  const head='<tr><th class="l">Job type</th>'+deltaMonths.map(m=>'<th>'+monthName(m)+'</th>').join('')+'</tr>';
  const body=sectors.map((s,i)=>'<tr><td class="l"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+TR_PALETTE[i%TR_PALETTE.length]+';margin-right:6px"></span><b>'+esc(s)+'</b></td>'+basisArr(s).map(v=>'<td>'+(v?money(v):'<span class="muted">—</span>')+'</td>').join('')+'</tr>').join('');
  const tot='<tr style="font-weight:bold;background:#f7f9fc"><td class="l">Company '+basisWord+'</td>'+compBasis.map(v=>'<td>'+money(v)+'</td>').join('')+'</tr>';
  listEl.innerHTML='<div class="rwrap"><table class="rtable"><thead>'+head+'</thead><tbody>'+body+tot+'</tbody></table></div>';
}

// Procore-style cost projection card, Procore vs CE side by side (Budget -> EAC -> Overrun -> ETC).
function projCostCard(r){
  const c=r.ce||{};
  const rpt=isRpt(r);   // CE numbers came from the WIP report export (no budget/committed columns)
  // raw (nullable) so we can show "n/a" when a source genuinely doesn't provide a field
  const Praw={b:r.budget_revised,cost:r.cost_to_date,k:r.committed,e:r.projected_cost};
  const Craw={b:c.ce_orig_est_cost,cost:c.ce_actual_cost,k:c.ce_committed,e:c.ce_projected_cost};
  const P={b:num(Praw.b),cost:num(Praw.cost),k:num(Praw.k),e:num(Praw.e)};
  const C={b:num(Craw.b),cost:num(Craw.cost),k:num(Craw.k),e:num(Craw.e)};
  const hasP=P.e>0||P.cost>0||P.b>0, hasC=C.e>0||C.cost>0;
  const ov=x=>(x.e>0&&x.b>0)?(x.e-x.b):null;          // Overrun = EAC − Revised Budget
  const etc=x=>(x.e>0)?(x.e-x.cost):null;             // Estimate To Complete = EAC − Cost-to-Date
  const pctc=x=>(x.e>0)?(x.cost/x.e*100):null;
  const na='<span class="muted" title="Not provided by this source">n/a</span>', dash='<span class="muted">—</span>';
  const mP=v=>(!hasP||v==null)?(hasP?na:dash):money(v);                 // Procore cell
  const mC=v=>v==null?na:(hasC?money(v):dash);                          // CE cell: null -> n/a (report has no budget/committed)
  const ovCell=x=>{ const o=ov(x); if(o==null) return na; return '<span class="'+(o>0?'fover':'funder')+'">'+(o>0?'Over ':'Under ')+money(Math.abs(o))+'</span>'; };
  const etcCell=x=>{ const e=etc(x); return e==null?na:money(e); };
  const pctCell=x=>{ const p=pctc(x); return p==null?na:Math.round(p)+'%'; };
  const rowT=(label,pv,cv,hl)=>'<tr'+(hl?' style="background:#f7faff"':'')+'><td class="l">'+label+'</td><td>'+pv+'</td><td>'+cv+'</td></tr>';
  const eacVar=(hasP&&hasC&&P.e>0&&C.e>0)?(P.e-C.e):null;
  const varChip=(eacVar!=null&&Math.abs(eacVar)>Math.max(5000,P.e*0.01))?'<span class="chip" style="background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e" title="Procore EAC ('+money(P.e)+') vs CE EAC ('+money(C.e)+') differ by '+smoney(eacVar)+'">&#9888; EAC Δ '+smoney(eacVar)+'</span>':'';
  return '<div class="pcard fin" style="margin-bottom:10px">'
    +'<div class="phead"><span class="pname">'+esc(r.project)+'</span><span class="pnum">'+esc(r.project_number)+'</span><span class="chip stage">'+esc(r.stage)+'</span>'+rptChip(r)+varChip+'</div>'
    +'<div class="rwrap"><table class="rtable"><thead><tr><th class="l">Metric</th><th>Procore</th><th>ComputerEase'+(rpt?' (report)':'')+'</th></tr></thead><tbody>'
    +rowT('Revised Budget',mP(Praw.b),mC(Craw.b))
    +rowT('Cost to Date',mP(Praw.cost),mC(Craw.cost))
    +rowT('Committed',mP(Praw.k),mC(Craw.k))
    +rowT('EAC (projected cost)','<b>'+mP(Praw.e)+'</b>','<b>'+mC(Craw.e)+'</b>',true)
    +rowT('Overrun (EAC − Budget)',ovCell(P),ovCell(C),true)
    +rowT('ETC (cost to complete)',etcCell(P),etcCell(C))
    +rowT('% at Completion',pctCell(P),pctCell(C))
    +'</tbody></table></div></div>';
}

function recClassify(r){
  // returns {kind, cls, status, pC,cC,dC,pCost,cCost,pCom,cCom,pE,cE, markup, eac}
  const pC=num(r.revised_contract||r.contract_amount);
  if(!r.ce) return {kind:'notce',cls:'nce',status:'Not in CE',pC,cC:null,dC:null,
    pCost:num(r.cost_to_date)||null,cCost:null,pCom:num(r.committed)||null,cCom:null,
    pE:num(r.projected_cost)||null,cE:null,markup:false,eac:false};
  const cC=num(r.ce.ce_contract), dC=pC-cC;
  const pCost=num(r.cost_to_date), cCost=num(r.ce.ce_actual_cost);
  const pCom=num(r.committed), cCom=(r.ce.ce_committed==null?null:num(r.ce.ce_committed));
  const pE=num(r.projected_cost), cE=num(r.ce.ce_projected_cost);
  const markup=r.markup_gap>0, eac=r.eac_gap!==0 && r.eac_gap!=null;
  let kind,cls,status;
  if(Math.abs(dC)>1){ kind='mismatch'; cls='miss'; status='Contract Δ '+smoney(dC)+' (Spark)'; }
  else if(eac){ kind='insync'; cls='eacw'; status='EAC not synced '+smoney(r.eac_gap); }
  else { kind='insync'; cls=''; status='In sync'; }
  return {kind,cls,status,pC,cC,dC,pCost,cCost,pCom,cCom,pE,cE,markup,eac};
}

    card('total',money(totContract),'Total Contract (rev.)',null,'REVENUE — sum of each shown project’s Revised Contract, from the Procore prime contracts.')
   +card('co',money(totEac),'Projected Cost (EAC)',null,'COST — sum of Estimate at Completion from the Cost Projections budget view (projected total cost to build).')
   +card(totMargin<0?'nc':'ok',smoney(totMargin)+(marginPct!=null?' · '+marginPct.toFixed(1)+'%':''),'Projected Margin',null,'Revised Contract − Projected Cost (EAC) across shown projects. Negative = projected loss.')
   +card('soon',loss.length,'Projects at Loss','over','Shown active projects where Projected Cost exceeds Revised Contract (projected margin negative). Click to filter.')
   +card('rfi',money(totCommitted),'Committed',null,'COST — sum of Commitments (SUB/PO/PSA): executed subcontract & PO value.')
   +card('co',money(totJtd),'Cost to Date',null,'COST — sum of Job to Date Costs (actual cost incurred so far).');
  document.getElementById('finVar').innerHTML = loss.length
    ? '<div class="varbox"><b>&#9888; Projected loss ('+loss.length+')</b><div style="margin-top:7px;line-height:1.7">'
        +loss.map(r=>'<a href="'+pcBase(r.procore_id)+'/tools/budgeting" target="_blank" style="color:#211E1E;text-decoration:none;font-weight:600">'+esc(r.project)+'</a> — <span class="fover">'+smoney(r.projected_margin)+'</span> <span style="color:#7a828f">(projected cost '+money(r.projected_cost)+' vs contract '+money(r.revised_contract||r.contract_amount)+')</span>').join('<br>')
        +'</div></div>'
    : '<div class="varbox clean"><b>&#10003; No projects projected to lose money</b> <span style="color:#7a828f">— Projected Cost (EAC) is within contract on all shown active jobs.</span></div>';
  document.getElementById('finList').innerHTML = list.length ? list.map(fcard).join('') : '<div class="empty">No projects match.</div>';
}
function fcard(r){
  const hasCost=!!r.projected_cost;
  const marginNeg = r.projected_margin<0;
  const overCls = hasCost ? (marginNeg?'o':'u') : '';
  const pill = hasCost
    ? '<span class="pright"><span class="pill '+(marginNeg?'r':'g')+'">'+(marginNeg?'Projected loss':'Margin '+(r.projected_margin_pct!=null?r.projected_margin_pct.toFixed(1)+'%':''))+'</span></span>'
    : '';
  const marginCell = hasCost ? '<span class="'+(marginNeg?'fover':'funder')+'">'+smoney(r.projected_margin)+(r.projected_margin_pct!=null?' · '+r.projected_margin_pct.toFixed(1)+'%':'')+'</span>' : '—';
  const pctCell = (r.pct_complete!=null)? Math.round(r.pct_complete)+'%' : '—';
  const ouCell = hasCost ? '<span class="'+(r.over_under_budget<0?'fover':'funder')+'">'+(r.over_under_budget<0?'Over ':'Under ')+money(Math.abs(r.over_under_budget))+'</span>' : '—';
  const pid=r.procore_id; const s={contract:pcBase(pid)+'/tools/prime-contracts',budget:pcBase(pid)+'/tools/budgeting',project:pcOverview(pid)};
  const src=r.cost_source||'';
  const srcShort=/subcontractor/i.test(src)?'Cost Projections view':(/ce.?import/i.test(src)?'CE Import (contract mirror)':(src||'—'));
  const srcChip = hasCost
    ? '<span class="chip" style="background:#eef2f8;color:#5b6472;border:1px solid #d6deea" title="Procore cost figures pulled from budget view: '+esc(src)+'">src: '+esc(srcShort)+'</span>'
    : '<span class="chip" style="background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e" title="No cost found in a Procore budget view'+(src?(' (view read: '+esc(src)+')'):'')+' — this job may track cost only in Direct Costs / ComputerEase.">&#9888; no Procore cost</span>';
  return '<div class="pcard fin '+overCls+'">'
    +'<div class="phead"><span class="pname"><a href="'+esc(s.project)+'" target="_blank">'+esc(r.project)+'</a></span><span class="pnum">'+esc(r.project_number)+'</span>'
    +'<span class="chip stage">'+esc(r.stage)+'</span>'+srcChip+pill+'</div>'
    +'<div class="pgrid">'
    +kv('Contract','<span class="money">'+money(r.contract_amount)+'</span>','REVENUE — Procore prime contract grand_total (original contract, before COs).')
    +kv('Approved COs','<span class="money">'+money(r.approved_cos)+'</span>','REVENUE — prime contract approved_change_orders.')
    +kv('Pending COs','<span class="money">'+money(r.pending_cos)+'</span>','REVENUE — prime contract pending_change_orders_amount (not yet approved).')
    +kv('Revised Contract','<span class="money">'+money(r.revised_contract)+'</span>','REVENUE — revised_contract_amount = Contract ('+money(r.contract_amount)+') + Approved COs ('+money(r.approved_cos)+').')
    +kv('Committed','<span class="money">'+money(r.committed)+'</span>','COST — Commitments (SUB/PO/PSA): executed subcontract & PO value (Cost Projections view).')
    +kv('Cost to Date','<span class="money">'+money(r.cost_to_date)+'</span>','COST — Job to Date Costs: actual cost incurred so far (matches CE actual cost).')
    +kv('Projected Cost (EAC)','<span class="money">'+money(r.projected_cost)+'</span>','COST — Estimate at Completion: projected total cost to finish the job.')
    +kv('Projected Margin',marginCell,'Revised Contract ('+money(r.revised_contract||r.contract_amount)+') − Projected Cost ('+money(r.projected_cost)+'). Negative = projected loss.')
    +kv('% Complete',pctCell,'Cost-based: Cost to Date ('+money(r.cost_to_date)+') ÷ Projected Cost ('+money(r.projected_cost)+').')
    +kv('Over/Under Budget',ouCell,'Revised Budget ('+money(r.budget_revised)+') − Projected Cost ('+money(r.projected_cost)+'). Note: on this view the budget mirrors the contract.')
    +kv('COs approved this mo',(r.cos_approved_this_month||0)+(r.cos_approved_this_month_amt?' · '+money(r.cos_approved_this_month_amt):''),'Prime (owner-side) change-order packages approved/executed this calendar month. Count · total.')
    +kv('Commitment COs (cost)','<span class="money">'+smoney(r.commitment_cos)+'</span>','COST — approved commitment (subcontract/PO) change orders. Can be negative when deductive.')
    +kv('Commitment COs this mo',(r.commitment_cos_this_month||0)+(r.commitment_cos_this_month_amt?' · '+smoney(r.commitment_cos_this_month_amt):''),'Approved commitment change orders this calendar month. Count · total.')
    +'</div>'
    +'<div class="srclinks"><a href="'+esc(s.contract)+'" target="_blank">Prime contract / COs</a><a href="'+esc(s.budget)+'" target="_blank">Budget (Cost Projections)</a><a href="'+esc(s.project)+'" target="_blank">Procore project</a></div>'
    +'</div>';
}
load();
</script>
