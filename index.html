<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Information</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Montserrat',Arial,sans-serif;background:#f5f7fa;color:#211E1E}
  .bh-topbar{height:4px;background:#ED2B30;width:100%}
  .bh-banner{background:#fff;border-bottom:1px solid #E8E6E7;width:100%}
  .bh-banner-inner{max-width:1300px;margin:0 auto;padding:12px 20px 14px;display:flex;align-items:center;gap:18px}
  .bh-logo{height:54px;width:auto;flex:none}
  .bh-title{color:#211E1E;font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .bh-sub{color:#5b6472;font-size:12.5px;margin-top:3px}
  .bh-badge{margin-left:auto;border:1px solid #1a7f37;color:#1a7f37;background:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:bold;letter-spacing:.05em;white-space:nowrap}
  .wrap{max-width:1300px;margin:0 auto;padding:20px}
  .banner{background:#fff7e6;border:1px solid #f0d089;color:#7a5a12;padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .err{background:#FFC7CE;border-color:#e6a3a3;color:#9C0006}
  #map{height:380px;border-radius:12px;border:1px solid #e3e8f0;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .controls label{font-size:13px;color:#40485a;font-weight:bold}
  select,input[type=text]{padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;font-size:14px;background:#fff}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:13px 15px;cursor:pointer}
  .card .n{font-size:24px;font-weight:bold}.card .l{font-size:11px;color:#5b6472;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .card.total .n{color:#7F1B29}.card.soon .n{color:#9a6a00}.card.ok .n{color:#1a7f37}.card.rfi .n{color:#1a4fb0}.card.co .n{color:#484B4D}.card.nc .n{color:#b3261e}
  .card.sel{outline:2px solid #ED2B30;outline-offset:-2px}.card.clk{cursor:pointer}.card.noclk{cursor:default}
  /* Power BI-style 3-metric KPI card, BH palette. A stat tile, not a chart: no hover layer. */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin-bottom:18px}
  .kpi3{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:12px 14px}
  .kpi3.acc{border:2px solid #1F3864}
  .kpi3 .kt{font-size:12px;font-weight:700;color:#1F3864;margin-bottom:9px;letter-spacing:.01em}
  .kpi3.acc .kt{color:#1F3864}
  .kpi3 .kv{font-size:21px;font-weight:700;color:#211E1E;line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi3 .kv.neg{color:#b3261e}.kpi3 .kv.pos{color:#1a7f37}
  .kpi3 .kl{font-size:11px;color:#5b6472;margin:1px 0 9px}
  .kpi3 .kl:last-child{margin-bottom:0}
  /* Dense schedule. Banded rows, tabular figures, accounting negatives. */
  .wtable{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  .wtable th{background:#f7f9fc;color:#1F3864;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
             padding:8px 9px;text-align:right;border-bottom:2px solid #c7cfdb;white-space:nowrap}
  .wtable th.l,.wtable td.l{text-align:left}
  .wtable td{padding:6px 9px;text-align:right;border-bottom:1px solid #eef1f6;white-space:nowrap}
  .wtable tbody tr:nth-child(even){background:#fafbfd}
  .wtable tbody tr:hover{background:#eef3fb}
  .wtable tfoot td{padding:9px;font-weight:700;border-top:2px solid #1F3864;background:#f7f9fc;color:#1F3864}
  .wneg{color:#b3261e}.wpos{color:#1a7f37}.wmut{color:#98a0ad}
  .wjob{font-weight:600;color:#211E1E}.wsub{font-size:11px;color:#7a828f;font-weight:400}
  @media (max-width:900px){ .wrap-scroll{overflow-x:auto} }
  .pcard{background:#fff;border:1px solid #e3e8f0;border-left:6px solid #484B4D;border-radius:10px;padding:12px 16px;margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .pcard.g{border-left-color:#1a7f37}.pcard.y{border-left-color:#c99a00}.pcard.r{border-left-color:#b3261e}
  .phead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .pname{font-weight:bold;font-size:15px;color:#211E1E}
  .pname a{color:inherit;text-decoration:none}.pname a:hover{color:#ED2B30;text-decoration:underline}
  .pnum{font-size:12px;color:#5b6472}
  .chip{padding:1px 8px;border-radius:999px;font-size:10px;font-weight:bold;white-space:nowrap}
  .chip.stage{background:#eef2f8;color:#1F3864;border:1px solid #cfe0f3}
  .chip.sect{background:#f1efe9;color:#6a5a3a;border:1px solid #e2d9c7}
  .chip.close{background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e}
  .chip.sp{background:#ECE7F5;color:#4a2f7a;border:1px solid #d6c8ee}
  .pright{margin-left:auto;display:flex;gap:8px;align-items:center}
  .pill{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:bold}
  .pill.g{background:#C6EFCE;color:#006100}.pill.y{background:#FFEB9C;color:#9C6500}.pill.r{background:#FFC7CE;color:#9C0006}.pill.n{background:#eef1f6;color:#8a92a1}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 18px;margin-top:9px;font-size:12.5px}
  .pgrid .k{color:#7a828f;font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;font-weight:700}
  .pgrid .v{color:#2b3240}
  .team{margin-top:8px;font-size:12px;color:#40485a;border-top:1px solid #f0f2f6;padding-top:7px}
  .team b{color:#211E1E}
  .money{font-variant-numeric:tabular-nums}
  .over{color:#b3261e;font-weight:bold}.under{color:#1a7f37;font-weight:bold}
  .srclinks{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .srclinks a{font-size:11px;color:#484B4D;border:1px solid #cfd6e0;border-radius:6px;padding:2px 8px;text-decoration:none;background:#fff}
  .srclinks a:hover{background:#484B4D;color:#fff}
  .empty{color:#5b6472;font-style:italic;padding:16px 0}
  .loading{padding:40px;text-align:center;color:#5b6472}
  footer{margin-top:26px;font-size:11.5px;color:#8a92a1;border-top:1px solid #e3e8f0;padding-top:12px;line-height:1.5}
  .tabs{display:flex;gap:2px;border-bottom:2px solid #e3e8f0;margin-bottom:16px}
  .tab{padding:9px 20px;font-size:14px;font-weight:700;color:#5b6472;cursor:pointer;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit}
  .tab.active{color:#ED2B30;border-bottom-color:#ED2B30}
  .panel{display:none}.panel.active{display:block}
  .ms{position:relative;display:inline-block}
  .ms-btn{padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;min-width:190px;text-align:left;font-family:inherit}
  .ms-btn:after{content:'▾';float:right;color:#8a92a1}
  .ms-panel{position:absolute;z-index:1000;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #c7cfdb;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:8px;width:320px;max-height:340px;overflow:auto;display:none}
  .ms-panel.open{display:block}
  .ms-tools{display:flex;gap:8px;margin-bottom:6px}
  .ms-tools button{font-size:11px;padding:3px 9px;border:1px solid #cfd6e0;border-radius:6px;background:#f5f7fa;cursor:pointer;font-family:inherit}
  .ms-search{width:100%;margin-bottom:6px}
  .ms-item{display:flex;align-items:center;gap:7px;padding:3px 4px;font-size:12.5px;cursor:pointer;border-radius:4px}
  .ms-item:hover{background:#f5f7fa}
  .fover{color:#b3261e;font-weight:bold}.funder{color:#1a7f37;font-weight:bold}
  .pcard.fin{border-left-color:#484B4D}.pcard.fin.o{border-left-color:#b3261e}.pcard.fin.u{border-left-color:#1a7f37}
  .varbox{background:#fff;border:1px solid #e3e8f0;border-left:5px solid #b3261e;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px}
  .varbox.clean{border-left-color:#1a7f37}
  .varbox b{color:#211E1E}
  .pgrid .k.tip{border-bottom:1px dotted #aab2be;cursor:help}
  .card[title]{cursor:help}
  .fnote{font-size:12.5px;color:#40485a;background:#f0f4fa;border:1px solid #d5e0f0;border-radius:8px;padding:9px 13px;margin-bottom:14px}
  .rwrap{overflow-x:auto;border:1px solid #e3e8f0;border-radius:10px;background:#fff}
  .rtable{width:100%;border-collapse:collapse;font-size:12.5px}
  .rtable th,.rtable td{padding:7px 10px;border-bottom:1px solid #eef1f6;text-align:right;white-space:nowrap}
  .rtable th{position:sticky;top:0;background:#f7f9fc;color:#7a828f;font-size:10px;text-transform:uppercase;letter-spacing:.02em}
  .rtable td.l,.rtable th.l{text-align:left}
  .rtable tr.miss td{background:#fff5f5}.rtable tr.nce td{background:#fffaf0}.rtable tr.eacw td{background:#fff8ec}
  .rdelta.d{color:#b3261e;font-weight:bold}.rdelta.z{color:#1a7f37}
  .rstat.ok{color:#1a7f37;font-weight:bold}.rstat.bad{color:#b3261e;font-weight:bold}.rstat.warn{color:#9a6a00;font-weight:bold}
  /* keep pills/chips/number tiles from overflowing */
  .pill,.chip{white-space:nowrap;flex:none}
  .pright{flex-wrap:wrap;justify-content:flex-end;max-width:100%}
  .card{overflow:hidden}
  .card .n{line-height:1.12}
  /* ---------------- mobile ---------------- */
  @media (max-width:680px){
    .wrap{padding:12px}
    .bh-banner-inner{gap:10px;padding:10px 12px 12px}
    .bh-logo{height:40px}.bh-title{font-size:18px}.bh-sub{font-size:11px}
    #map{height:260px;margin-bottom:14px}
    .controls{gap:8px}.controls label{font-size:12px}
    select,input[type=text]{font-size:13px;padding:7px 9px}
    #q{min-width:0;flex:1 1 100%;width:100%}
    .cards{grid-template-columns:1fr 1fr;gap:8px}
    .card{padding:10px 11px}.card .n{font-size:16px}
    .pcard{padding:11px 13px}
    .pgrid{grid-template-columns:1fr 1fr;gap:6px 14px}
    .phead{gap:6px}
    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
    .tab{padding:8px 13px;font-size:13px;white-space:nowrap;flex:none}
    .ms-panel{width:min(300px,86vw)}
    .banner,.fnote{font-size:12px}
  }
  /* ---- Project Detail (consolidated cards + charts) ------------------------
     Chart colors are the validated categorical slots 1-3 (blue/orange/aqua):
     all-pairs CVD dE 9.2, normal-vision dE 24.0 on a white surface. Aqua sits
     below 3:1 contrast, so every aqua mark carries a direct label or a table
     row - do not drop those. Brand red is NOT a series color: on this page red
     means "bad" (over budget, non-compliant) and must keep meaning only that. */
  .dwrap{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#211E1E;--mut:#7a828f;--line:#e3e8f0}
  .dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
  .dhead .dn{font-size:19px;font-weight:bold;color:var(--ink)}
  .dhead .dnum{color:var(--mut);font-size:13px}
  .dstrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .dbox{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
  .dbox .dl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  .dbox .dv{font-size:15px;font-weight:bold;color:var(--ink);margin-top:2px}
  .dbox.na .dv{color:var(--mut);font-weight:normal}
  .kstack{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px;align-items:start}
  .kcard{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff}
  .kcard.hl{border-color:var(--s1);box-shadow:inset 3px 0 0 var(--s1)}
  .kcard .kt{font-size:12px;font-weight:bold;color:var(--s1);margin-bottom:7px}
  .kcard.hl .kt{color:var(--s1)}
  .kcard .kr{margin-bottom:6px}
  .kcard .kr:last-child{margin-bottom:0}
  .kcard .kn{font-size:18px;font-weight:bold;color:var(--ink);line-height:1.15}
  .kcard .kn.na{color:var(--mut);font-weight:normal;font-size:15px}
  .kcard .kn.neg{color:#c0272d}
  .kcard .kl{font-size:11px;color:var(--mut)}
  .kcard .kt .src{float:right;font-size:9px;font-weight:normal;letter-spacing:.04em;text-transform:uppercase;
    color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:0 4px;line-height:1.7;cursor:help}
  /* Fee erosion card - planned fee vs forecast fee, stated rather than left to be subtracted.
     Sits immediately after Current Projection, the card it is the difference against. */
  .kcard.fer{border-left-width:4px}
  .kcard.fer .kn{font-size:20px}
  .kcard.fer .fp{font-size:12px;font-weight:bold;color:var(--mut);margin-top:-2px}
  .kcard.fer .fm{font-size:10px;color:var(--mut);line-height:1.6;margin-top:9px;
    padding-top:7px;border-top:1px dotted var(--line)}
  .kcard.fer .fm .xref{cursor:help;border-bottom:1px dotted var(--line)}
  .kcard.fer.good{border-left-color:#1baf7a} .kcard.fer.good .kn{color:#12805a}
  .kcard.fer.warn{border-left-color:#d68910} .kcard.fer.warn .kn{color:#8a5a00}
  .kcard.fer.bad{border-left-color:#c0272d}  .kcard.fer.bad  .kn{color:#c0272d}
  .vizgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:14px}
  .vizbox{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;min-width:0}
  .vizbox .vt{font-size:13px;font-weight:bold;color:var(--ink);margin-bottom:2px}
  .vizbox .vs{font-size:11px;color:var(--mut);margin-bottom:8px}
  .vizbox .cwrap{position:relative;height:210px}
  .vizbox .empty{margin:0;padding:22px 10px;text-align:center}
  @media (max-width:720px){ .vizgrid{grid-template-columns:1fr} .vizbox .cwrap{height:190px} }
  @media (max-width:420px){ .cards{grid-template-columns:1fr 1fr}.pgrid{grid-template-columns:1fr} }
</style>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.7.1/lib/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>

async function getToken(){ await msalApp.initialize(); const redir=await msalApp.handleRedirectPromise(); let acct=(redir&&redir.account)||msalApp.getAllAccounts()[0]; if(!acct){ await msalApp.loginRedirect({scopes:SCOPES}); return null;} msalApp.setActiveAccount(acct); try{const t=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return t.accessToken;}catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES});return null;} }
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const money=n=>(n||n===0)?'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:0}):'—';
const smoney=n=>{ n=num(n); return (n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString(); };  // signed (deductive COs can be negative)

/* ---------- projection model (percent-complete, live/current) ----------
   Fee = Margin = Profit = Contract − Projected Cost (EAC).
   % complete = Cost-to-Date ÷ EAC ; Revenue Recognized = %×Contract ;
   Remaining Revenue (backlog) = Contract − Recognized ; spread straight-line
   over Months-to-Complete (now → projected completion). */
function projOf(r){
  const c=r.ce; if(!c) return null;
  const contract=num(c.ce_contract)||num(r.revised_contract)||num(r.contract_amount);
  const eac=num(c.ce_projected_cost), cost=num(c.ce_actual_cost);
  const margin=contract-eac, pct=eac?cost/eac:0;
  const revRec=contract*pct, remaining=contract-revRec;
  let months=null; const compl=r.completion_date?new Date(r.completion_date):null; const now=new Date();
  if(compl&&!isNaN(compl.getTime())) months=Math.max(0,(compl.getFullYear()-now.getFullYear())*12+(compl.getMonth()-now.getMonth()));
  const monthly=(months!=null)?remaining/(months+1):null;
  return {contract,eac,cost,margin,marginPct:contract?margin/contract*100:null,pct:pct*100,revRec,remaining,months,monthly,compl};
}
function monthLabels(n){ const out=[]; const t=new Date(); for(let i=0;i<n;i++){ const d=new Date(t.getFullYear(),t.getMonth()+i,1); out.push(d.toLocaleString(undefined,{month:'short',year:'2-digit'})); } return out; }
async function fetchFile(token, path){
  const H={Authorization:'Bearer '+token};
  try{ const s=await fetch('https://graph.microsoft.com/v1.0/sites/'+SITE_PATH,{headers:H});
    if(s.ok){ const sid=(await s.json()).id;
      const r=await fetch('https://graph.microsoft.com/v1.0/sites/'+sid+'/drive/root:/'+encodeURI(path)+':/content',{headers:H});
      if(r.ok) return r; } }catch(e){}
  return fetch('https://graph.microsoft.com/v1.0/drives/'+DRIVE_ID+'/root:/'+encodeURI(path)+':/content',{headers:H});
}
async function load(){
  try{
    const token=await getToken(); if(!token) return;
    const res=await fetchFile(token, PROJECTS_PATH);
    if(!res.ok) throw new Error('Graph HTTP '+res.status+' (need access to projects_data.json)');
    const data=await res.json();
    ROWS=(data.projects||[]).filter(r=>!/\bFY\s?\d{2,4}\b/i.test((r.project||'')+' '+(r.project_number||'')));  // drop internal FY-tracking projects
    GENERATED=data.generated_at||'';
    // CE WIP data (best-effort) — merge by job_code = project_number
    try{ const cr=await fetchFile(token, CE_PATH);
      if(cr.ok){ const cd=await cr.json(); const cem={}; for(const j of (cd.jobs||[])) cem[String(j.job_code)]=j;
        for(const r of ROWS){ r.ce=cem[String(r.project_number)]||null; }
        /* Gaps are computed in computeGaps(), AFTER the phase 90 fee is taken out of
           Procore's EAC. Computing them here used Procore's GROSS EAC against CE's
           cost-only one and reported the fee itself as a sync failure — Fox Run read
           "EAC not synced $749,039" when the real difference was $15,363 and the EAC
           had in fact been imported that morning. */
        CE_GENERATED=cd.generated_at||''; }
    }catch(e){}
    // Monthly reviewed snapshots (best-effort; tab shows an empty state until the first month is imported)
    try{ const mr=await fetchFile(token, PROJSNAP_PATH); if(mr.ok){ MONTHLY=await mr.json(); } }catch(e){ MONTHLY=null; }
    // Budget-code snapshot index (best-effort; the comparison shows an empty state until the lines import runs)
    try{ const sx=await fetchFile(token, SNAPLINES_DIR+'/_index.json'); if(sx.ok){ SNAPIDX=await sx.json(); } }catch(e){ SNAPIDX=null; }
    try{ const rx=await fetchFile(token, SNAPLINES_DIR+'/_rollup.json'); if(rx.ok){ ROLLUP=await rx.json(); } }catch(e){ ROLLUP=null; }
    try{ applyFeeBasis(); }catch(e){ console.error('fee basis',e); }
    try{ computeGaps(); }catch(e){ console.error('gaps',e); }
    try{ const ch=await fetchFile(token, COSTHIST_PATH); if(ch.ok){ COSTHIST=await ch.json(); } }catch(e){ COSTHIST=null; }
    try{ const hr=await fetchFile(token, CEHIST_PATH); if(hr.ok){ CEHIST=await hr.json(); } }catch(e){ CEHIST=null; }
    document.getElementById('asof').textContent=GENERATED?('data as of '+new Date(GENERATED).toLocaleString()+(CE_GENERATED?' · CE '+new Date(CE_GENERATED).toLocaleString():'')):'';
    buildUI();
  }catch(e){ const b=document.getElementById('banner'); b.style.display='block'; b.className='banner err'; b.textContent='Sign-in or data load failed: '+(e&&e.message||e); document.getElementById('content').innerHTML=''; }
}

function structFiltered(){
  const fS=fSector.value,fO=fOffice.value,fF=fFlag.value;
  let v=ROWS.filter(r=>(!fS||r.sector===fS)&&(STAGES_SEL?STAGES_SEL.has(r.stage):true)&&(!fO||r.office===fO));
  if(fF==='close') v=v.filter(r=>r.closing_this_month);
  else if(fF==='fc') v=v.filter(r=>r.compliance&&r.compliance.fully_compliant);
  else if(fF==='nc') v=v.filter(r=>r.compliance&&r.compliance.noncompliant>0);
  else if(fF==='rfi') v=v.filter(r=>r.rfis_open>0);
  else if(fF==='over') v=v.filter(r=>r.projected_cost&&r.projected_margin<0);
  return v;
}

/* ---------- Buyout status & contingency ----------
   Reads snapshot_lines/_rollup.json (written by import_snapshot_lines.js). Two numbers
   per job, both straight from Procore budget codes:
     buyout coverage   = committed / budget excluding the fee phase
     contingency left  = EAC of the contingency phase (50) - what is still PROJECTED to
                         be spent out of BH contingency, i.e. money that becomes profit
                         only if it is released.
   BH's own projection FAQ: "BH Contingency - ... a big slush fund to cover lack of
   management ... should be flushed out and moved to profit once buyout is complete."
   Nothing in CE or Procore prompts that decision, so this table does.
   Buyout coverage is a PROXY for buyout being complete, not a milestone date - the
   pipeline has no milestone field. It is live and self-updating, which a typed date is not. */
var WIPVIEW='ops';   // 'ops' = budget & buyout columns | 'cfo' = the balance-sheet WIP schedule
function setWipView(v){ WIPVIEW=v; render(); }
var BUYOUT_COVER_FLAG = 75;    // % of non-fee budget committed before contingency is "due a decision"
function buyoutRows(list){
  if(!ROLLUP||!Array.isArray(ROLLUP.jobs)) return null;
  /* Same list the rest of the tab is showing - including an as-of month restatement.
     Reading finView() here instead made this table show jobs while every other panel
     was empty, which reads as a bug in the data rather than a filter. */
  const inView=new Set((list||finView()).map(r=>String(r.project_number)));
  return ROLLUP.jobs.filter(j=>inView.has(String(j.job_no)));
}
function renderBuyout(list){
  const out=document.getElementById('buyWrap'); if(!out) return;
  const rows=buyoutRows(list);
  if(rows===null){
    out.innerHTML='<div class="fnote" style="background:#fff7ef;border-color:#f0d9bf">&#128736; <b>Buyout &amp; contingency</b> needs <b>snapshot_lines/_rollup.json</b>. Re-run the <b>Budget snapshot LINES import</b> workflow &mdash; the rollup is written alongside the per-job files.</div>';
    return;
  }
  if(!rows.length){ out.innerHTML=''; return; }
  const flag=j=>(j.buyout_pct!=null&&j.buyout_pct>=BUYOUT_COVER_FLAG&&j.contingency_eac>0);
  const sorted=rows.slice().sort((x,y)=>(flag(y)-flag(x))||((y.contingency_eac||0)-(x.contingency_eac||0)));
  const due=sorted.filter(flag);
  const totalLeft=rows.reduce((a,j)=>a+(j.contingency_eac||0),0);
  const dueLeft=due.reduce((a,j)=>a+(j.contingency_eac||0),0);
  const head='<div class="fnote" style="background:#f4f7ff;border-color:#ccd8f5">&#127919; <b>Buyout status &amp; contingency.</b> '
    +'Coverage is committed &divide; budget excluding fee &mdash; a live stand-in for &ldquo;buyout complete&rdquo;, since no milestone date is pulled. '
    +'Contingency remaining is the phase '+esc(String((ROLLUP&&ROLLUP.contingency_phase)||'50'))+' <b>EAC</b>: still projected as cost, so it reaches profit only if released. '
    +'<b>'+due.length+' job'+(due.length===1?'':'s')+'</b> past '+BUYOUT_COVER_FLAG+'% bought out still '+(due.length===1?'holds':'hold')+' <b>'+money(dueLeft)+'</b> unreleased'
    +(rows.length>due.length?(' (portfolio total '+money(totalLeft)+')'):'')+'.</div>';
  const note=j=>{
    if(j.buyout_pct==null) return '<span style="color:#7a828f">no budget basis</span>';
    if(!j.contingency_eac) return (j.contingency_budget>0)
      ? '<span style="color:#1a7f37">fully released &mdash; '+money(j.contingency_budget)+' moved to profit</span>'
      : '<span style="color:#7a828f">no contingency carried</span>';
    if(flag(j)) return '<b>'+j.buyout_pct.toFixed(1)+'% bought out with '+money(j.contingency_eac)+' unreleased</b> &mdash; due a release decision';
    return j.buyout_pct.toFixed(1)+'% bought out &mdash; '+money(j.contingency_eac)+' still held against risk';
  };
  const body=sorted.map(j=>{
    const rel=j.contingency_released||0;
    return '<tr'+(flag(j)?' style="background:#fffbf0"':'')+'>'
      +'<td><b>'+esc(j.job_no)+'</b><div style="color:#7a828f;font-size:12px">'+esc(j.job_name||'')+'</div></td>'
      +'<td class="num">'+money(j.budget_ex_fee)+'</td>'

/* ---------- phase 90: take the FEE out of Procore's budget and EAC ----------
   Procore carries the project fee as a budget line (phase 90). ComputerEase does not —
   it holds phase 90 at 0.00 by design, because fee belongs to the CONTRACT side and is
   never a cost. Comparing Procore's budget straight to its contract therefore subtracts
   the fee from itself and reports 0% margin on a job earning 3%.
     Fox Run: budget 24,454,797 incl. 733,676 fee -> margin read $0 instead of $733,676;
              EAC    24,493,891 incl. 733,676 fee -> margin read -39,094 instead of +694,582.
   The fee amount is PER JOB and comes from snapshot_lines/_rollup.json, never a blanket
   percentage: most jobs never load phase 90 and must not be touched. Jobs with no rollup
   entry are left exactly as they were and marked fee_basis:'unknown', so the page can say
   so rather than implying it checked. Originals are kept for the tooltip. */
function applyFeeBasis(){
  const idx={}; if(ROLLUP&&Array.isArray(ROLLUP.jobs)) for(const j of ROLLUP.jobs) idx[String(j.job_no)]=j;
  for(const r of ROWS){
    /* If projects_pull.js already held phase 90 out at source it stamps cost_basis on
       the row. Stripping again here would remove the fee TWICE — on Fox Run that reads
       22,987,445 with a +1,467,352 margin, wrong in the opposite direction and plausible
       enough to miss. Source wins; the page only corrects rows the pull has not. */
    if(r.cost_basis==='ex-fee'||r.cost_basis==='no-fee-phase'){ r.fee_basis='source'; continue; }
    const j=idx[String(r.project_number)];
    if(!j){ r.fee_basis='unknown'; continue; }
    const feeB=num(j.fee_budget), feeE=num(j.fee_eac);
    r.fee_budget=feeB; r.fee_eac=feeE;
    if(!feeB&&!feeE){ r.fee_basis='none'; continue; }   // phase 90 not loaded: nothing to strip
    r.gross_budget_revised=num(r.budget_revised);
    r.gross_budget_original=num(r.budget_original);
    r.gross_projected_cost=num(r.projected_cost);
    if(num(r.budget_revised))  r.budget_revised  = r2c(num(r.budget_revised)-feeB);
    if(num(r.budget_original)) r.budget_original = r2c(num(r.budget_original)-feeB);
    if(num(r.projected_cost))  r.projected_cost  = r2c(num(r.projected_cost)-feeE);
    const contract=num(r.revised_contract||r.contract_amount);
    if(num(r.projected_cost)){
      r.projected_margin = r2c(contract-num(r.projected_cost));
      r.projected_margin_pct = contract?((contract-num(r.projected_cost))/contract*100):null;
      r.over_under_budget = r2c(num(r.budget_revised)-num(r.projected_cost));
      r.pct_complete = num(r.projected_cost)?(num(r.cost_to_date)/num(r.projected_cost)*100):r.pct_complete;
    }
    r.fee_basis='stripped';
  }
}
function r2c(n){ return Math.round(n*100)/100; }
function feeNote(r){
  if(r.fee_basis==='source') return 'Phase 90 was held out of cost by projects_pull.js at source'+(num(r.fee_budget)?' \u2014 fee '+money(r.fee_budget):'')+'. Budget and EAC are cost-only as pulled.';
  if(r.fee_basis==='stripped') return 'Procore’s fee of '+money(r.fee_budget||r.fee_eac)+' (phase 90) removed from budget and EAC — ComputerEase holds fee on the contract, never in cost.';
  if(r.fee_basis==='none')     return 'No phase 90 fee loaded in Procore for this job — budget and EAC are cost-only already.';
  return 'No budget-code rollup for this job yet, so any phase 90 fee is still inside its budget and EAC. Re-run the Budget snapshot LINES import.';
}


/* ---------- WIP schedule ----------
   The classic work-in-progress schedule: one row per job, a real total row, and the
   four derived figures an accountant expects, computed the way BH's own projection FAQ
   defines them:
       estimated profit  = contract - projected cost at completion
       % complete        = cost to date / projected cost at completion   (cost-based)
       earned revenue    = % complete x contract
       over/(under)      = billed - earned
   COST is the input and FEE is what falls out. The VP's workbook does the reverse -
   column X is =N-AF, projected cost derived FROM a typed fee - which is why erosion can
   never appear there. This table cannot hide it.
   ComputerEase is the source, because it is the accounting record revenue recognition
   runs on. Procore's EAC (fee-stripped, per job) sits alongside it as a check: the two
   are built from different data, so a small delta is healthy and a large one is a job
   worth opening. */
function wipRow(r){
  const ce=r.ce; if(!ce) return null;
  const contract=num(ce.ce_contract); if(contract<=0) return null;   // 15 CE jobs carry a zero contract; they'd read as a total loss
  const eac=num(ce.ce_projected_cost), ctd=num(ce.ce_actual_cost), billed=num(ce.ce_billed);
  const pctC=eac>0?(ctd/eac):null;
  const earned=(pctC!=null)?contract*pctC:null;
  const profit=contract-eac;
  const gpEarned=(pctC!=null)?profit*pctC:null;   // % complete x estimated gross profit
  return { job:r.project_number, name:r.project, contract:contract, eac:eac, profit:profit, gpEarned:gpEarned,
           cie:(earned!=null?Math.max(0,earned-billed):null),   // underbilled  - ASSET
           bie:(earned!=null?Math.max(0,billed-earned):null),   // overbilled   - LIABILITY
           pct: contract?(profit/contract*100):null, pctC:(pctC!=null?pctC*100:null),
           ctd:ctd, earned:earned, billed:billed,
           ou:(earned!=null?billed-earned:null),
           pcEac: (r.fee_basis==='stripped'||r.fee_basis==='none')?num(r.projected_cost):null,
           feeBasis:r.fee_basis };
}

  const oBud=S('budget_original'), rBud=S('budget_revised');

/* ---------- Procore vs CE gaps ----------
   MUST run after applyFeeBasis(). Both sides have to be on the same basis: Procore
   carries the fee as a budget line and CE never does, so comparing them raw reports
   the fee as a sync failure on every job that has phase 90 loaded. */
function computeGaps(){
  for(const r of ROWS){
    const pc=num(r.revised_contract||r.contract_amount), cc=r.ce?num(r.ce.ce_contract):0;
    r.markup_gap=(r.ce && (pc-cc)>1000)?(pc-cc):0;   // Procore contract > CE = markup not synced by Spark
    /* r.projected_cost is cost-only by this point — stripped here or at source by
       projects_pull.js. Where neither applied (fee_basis 'unknown'), the fee is still
       inside it and the gap will read high; the row says so on hover. */
    const pE=num(r.projected_cost), cE=r.ce?num(r.ce.ce_projected_cost):0;
    const eacTol=Math.max(5000, pE*0.01);
    r.eac_gap=(r.ce && pE>0 && cE>0 && Math.abs(pE-cE)>eacTol)?(pE-cE):0;
  }
}

const TR_PALETTE=['#2563eb','#16a34a','#d97706','#9333ea','#dc2626','#0891b2','#ca8a04','#db2777','#4f46e5','#059669'];
function renderTrends(){
  const cards=document.getElementById('trCards'), listEl=document.getElementById('trList'), note=document.getElementById('trNote'), titleEl=document.getElementById('trChartTitle');
  if(!cards) return;
  const isBill=TRMETRIC==='billings';

     approved budget snapshots, rolled up by import_snapshot_lines.js into cost_history.json.
     They are different measures - Procore Job-to-Date Cost is not CE actual cost - so the
     page says which one it is drawing rather than blending them. */

  const field=isBill?'ce_billed':(usingProcoreCost?'cost_to_date':'ce_actual_cost');
  const metricLabel=isBill?'Billings':'Cost';

  const topSecs=sectors.slice().sort((a,b)=>Math.abs(basisArr(b)[li])-Math.abs(basisArr(a)[li])).slice(0,4);

    +(unappr.length?' <span class="chip" style="background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e" title="'+unappr.length+' job(s) have no approved snapshot for this month yet — showing the latest available. Approve in Procore to lock the month.">&#9888; '+unappr.length+' unapproved</span>':(jobs.length?' <span class="chip" style="background:#e7f6ec;color:#1a7f37;border:1px solid #b7e0c2">&#10003; all approved</span>':''));

   +card('co',money(totEac),'Projected Cost (EAC)',null,'Sum of projected cost at completion.')
   +card(totFee<0?'nc':'ok',money(totFee),'Projected Fee',null,'Sum of projected fee.')
   +card(conVar<0?'nc':'ok',smoney(conVar),'Contract Δ vs prior mo',null,'Total change in projected contract vs the previous month.')

  const dcell=v=>{ const n=num(v); if(!n) return '<span class="muted">—</span>'; return '<span class="'+(n>0?'funder':'fover')+'">'+(n>0?'+':'')+smoney(n)+'</span>'; };

  const body=jobs.sort((a,b)=>num(b.projected_contract)-num(a.projected_contract)).map(j=>
    '<tr><td class="l"><b>'+esc(j.job_no||'')+'</b> '+esc(j.job_name||'')+(notAppr(j)?' <span class="chip" style="background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e" title="Snapshot &ldquo;'+esc(j.snapshot_label||'')+'&rdquo; is '+esc(j.approval_status||'')+' — not yet approved">unapproved</span>':'')+'</td>'

  /* Name the jobs the month did not capture. Without this the tab under-reports in
     silence; with it, the gap reads as a to-do list of snapshots to take or approve. */
  let miss='';
  if(missing.length){
    const everSnap=new Set();
    Object.keys(snaps).forEach(m=>((snaps[m]&&snaps[m].jobs)||[]).forEach(j=>everSnap.add(String(j.job_no))));
    const idxBy={}; ((SNAPIDX&&SNAPIDX.projects)||[]).forEach(p=>{ idxBy[String(p.job_no)]=p; });

      +'<div style="margin-top:8px;font-size:12px;line-height:1.7">'
      /* Say WHY, from evidence rather than inference. proj_snapshots.json only knows what
         the monthly import accepted; snapshot_lines/_index.json knows what actually exists
         in Procore. Reading both separates "Procore has nothing" from "Procore has one and
         the monthly import did not take it" - which are different jobs for different people. */
      +missing.map(r=>{
          const ix=idxBy[String(r.project_number)];
          const inProcore=ix?(ix.snapshots||[]).length:null;
          const thisMonth=ix?(ix.snapshots||[]).some(s=>s.month===MPMONTH):false;
          let why;

          else if(inProcore) why=inProcore+' snapshot'+(inProcore===1?'':'s')+' in Procore, none dated this month';
          else if(inProcore===0) why='no budget snapshot exists in Procore for this job';
          else if(everSnap.has(String(r.project_number))) why='in the monthly record for other months, not this one';
          else why='not in the snapshot index &mdash; run the lines import to find out why';
          return '<div><b>'+esc(r.project_number||'')+'</b> '+esc(r.project||'')
            +' <span class="muted">&mdash; '+why+'</span>'
            +' <span class="muted">('+money(r.revised_contract||r.contract_amount)+' contract)</span></div>';
        }).join('')

  }
  listEl.innerHTML='<div class="rwrap"><table class="rtable"><thead>'+head+'</thead><tbody>'+body+tot+'</tbody></table></div>'+miss;

function dSeries(file, jobNo, key, idField, guard){
  if(!file||!file.months||!file.snapshots) return [];
  const idf=idField||'job_code';
  return file.months.map(m=>{ const s=file.snapshots[m]; if(!s||!s.jobs) return {m:m,v:null};
    const j=s.jobs.find(x=>String(x[idf])===String(jobNo));
    if(!j||j[key]==null) return {m:m,v:null};
    /* The pull records contract as 0 on every job before Nov-2025 rather than
       omitting it, which drags a contract line flat along the axis and turns
       projected fee into a negative the size of the whole job. A guarded point
       is dropped, not zeroed - the line simply starts where the data starts. */
    if(guard && !(num(j[guard])>0)) return {m:m,v:null};

const dLastLabel={ id:'dLastLabel', afterDatasetsDraw(c){ const x=c.ctx;

  const L=[];

    const pts=meta.data||[]; if(!pts.length) return;
    let k=ds.data.length-1; while(k>=0&&ds.data[k]==null) k--;
    if(k<0||!pts[k]) return;
    L.push({y:pts[k].y, x:Math.min(pts[k].x,c.chartArea.right)+7, t:mshort(ds.data[k]), c:ds.borderColor||ds.backgroundColor}); });
  L.sort((a,b)=>a.y-b.y);
  const GAP=14;
  for(let i=1;i<L.length;i++) if(L[i].y-L[i-1].y<GAP) L[i].y=L[i-1].y+GAP;
  const over=L.length?L[L.length-1].y-c.chartArea.bottom:0;
  if(over>0) L.forEach(l=>l.y-=over);
  const up=L.length?c.chartArea.top-L[0].y:0;
  if(up>0) L.forEach(l=>l.y+=up);
  x.save(); x.font='bold 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  x.textAlign='left'; x.textBaseline='middle';
  L.forEach(l=>{ x.fillStyle=l.c; x.fillText(l.t, l.x, l.y); });
  x.restore(); } };

   on different cycles, so a reader comparing two cards needs to know whether they are
   watching one system disagree with itself or two systems disagree with each other. */
const SRC_PC='Read from Procore \u2014 contract, budget and the PM\u2019s cost projection. Cost-to-date and '
  +'committed originate in ComputerEase and flow to Procore, with burden already merged into labor.';
const SRC_CE='Read from ComputerEase \u2014 billing, and CE\u2019s own projected cost from the last imported '
  +'Revised Estimate. CE forecasts from the month-end line in the sand; Procore forecasts from the PM\u2019s latest snapshot.';
const srcTag=(s,t)=>'<span class="src" title="'+t+'">'+s+'</span>';

/* Fee erosion: what the job planned to earn against what it is now forecast to earn.
   Planned = revised contract - revised budget (the Estimated Margin on the Revised Estimate
   card). Forecast = Procore's projected margin. The page held both numbers and named the
   difference nowhere, so the reader had to subtract. It is arithmetically identical to Cost
   Position's "Budget - Projected" because the contract cancels out of both subtractions -
   the footnote says so, so one movement is not read as two problems.
   Thresholds are against PLANNED FEE, not contract: a 1% swing in contract can be a third
   of the fee on this kind of work, so contract-relative bands would never fire. */
function dFeeErosion(r,revMargin){
  const planned=num(revMargin);
  if(!(planned>0)||r.projected_margin==null||!num(r.budget_revised)) return '';
  const fc=num(r.projected_margin), d=fc-planned, pct=100*d/planned, a=Math.abs(pct);
  const cls=(d>=0)?' good':(a>=10?' bad':(a>=1?' warn':''));
  const head=(d<0)?'Fee erosion since budget':(d>0?'Fee gain since budget':'Fee holding at budget');
  return '<div class="kcard fer'+cls+'"><div class="kt">Fee Movement'+srcTag('Procore',SRC_PC)+'</div>'
    +'<div class="kr"><div class="kn">'+smoney(d)+'</div>'
      +'<div class="fp">'+(d>0?'+':'')+pct.toFixed(1)+'% of planned fee</div>'
      +'<div class="kl">'+head+'</div></div>'
    +'<div class="fm">'+smoney(planned)+' estimated margin &minus; '+smoney(fc)+' projected margin = '+smoney(d)+'<br>'
      +'<span class="xref" title="Fee planned minus fee forecast equals budget minus projected cost: the contract '
      +'cancels out of both subtractions. Cost Position states it as a cost variance, this card as a fee variance. '
      +'One movement, not two.">= <b>Budget &minus; Projected</b> on Cost Position</span></div>'
  +'</div>';
}

/* Per-cost-code file, lazy. Kept in its own cache so it never disturbs the
   Budget Snapshot Analysis state on the Monthly tab. */
async function dLoadLines(){
  const wrap=document.getElementById('dLines'); if(!wrap) return;
  if(DFILE&&DFILE.job_no===dProj().project_number){ dFillLines(); return; }
  if(DBUSY) return;
  const job=dProj().project_number;
  const idx=(SNAPIDX&&SNAPIDX.projects)?SNAPIDX.projects.some(p=>String(p.job_no)===String(job)):true;
  if(!idx){ DFILE=null; dFillLines('No budget-code file for this job.'); return; }
  DBUSY=true; wrap.innerHTML='<div class="loading">Loading budget codes for '+esc(job)+'&hellip;</div>';
  try{ const token=await getToken(); if(!token){ DBUSY=false; return; }
    const res=await fetchFile(token, SNAPLINES_DIR+'/'+job+'.json');
    if(!res.ok) throw new Error('Graph HTTP '+res.status);
    DFILE=await res.json();
  }catch(e){ DFILE=null; DBUSY=false; dFillLines('Could not load budget codes: '+esc((e&&e.message)||e)); return; }
  DBUSY=false; if(String(DFILE.job_no)!==String(job)) return; dFillLines();
}
/* Columns are positional: [0] revised budget, [1] job-to-date cost,
   [2] committed, [3] projected cost (EAC). Verified by summing a job's codes
   against cost_history for the same month; there is no header in the file. */
function dFillLines(err){
  const wrap=document.getElementById('dLines'); if(!wrap) return;
  const tw=document.getElementById('dTypeWrap');
  if(err||!DFILE||!DFILE.current||!DFILE.current.rows){
    wrap.innerHTML=dEmpty(err||'No live budget view stored for this job.');
    if(tw) tw.outerHTML='<div class="empty" style="padding:22px 10px;text-align:center">No cost-code breakdown for this job.</div>';
    return; }
  const codes=DFILE.codes||{}, rows=DFILE.current.rows;
  const list=Object.keys(rows).sort().map(k=>{ const a=rows[k]||[];
    const b=num(a[0]), c=num(a[1]), cm=num(a[2]), e=num(a[3]);
    return {code:k, type:(codes[k]&&codes[k].t)||'', budget:b, cost:c, committed:cm, eac:e, save:b-e}; });
  const T=f=>list.reduce((t,x)=>t+num(x[f]),0);
  // cost-type roll-up -> grouped bars
  const byType={}; list.forEach(x=>{ const t=x.type||'Unassigned';
    if(!byType[t]) byType[t]={b:0,e:0}; byType[t].b+=x.budget; byType[t].e+=x.eac; });
  const types=Object.keys(byType).filter(t=>Math.abs(byType[t].b)>0||Math.abs(byType[t].e)>0)
    .sort((a,b)=>byType[b].b-byType[a].b);
  if(types.length) dMakeChart('dChartType',{ type:'bar',
    data:{labels:types,datasets:[
      {label:'Revised budget',backgroundColor:DS1,data:types.map(t=>byType[t].b),borderRadius:4,borderSkipped:'bottom',barPercentage:.85,categoryPercentage:.68},
      {label:'Projected cost',backgroundColor:DS2,data:types.map(t=>byType[t].e),borderRadius:4,borderSkipped:'bottom',barPercentage:.85,categoryPercentage:.68}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      scales:dAxes(),plugins:{legend:dLegend(true),tooltip:dTip()}} });
  else if(tw) tw.outerHTML='<div class="empty" style="padding:22px 10px;text-align:center">No cost-type breakdown for this job.</div>';
  const sv=v=>{ const n=num(v); if(Math.round(n)===0) return '<span class="muted">0</span>';
    return '<span class="'+(n<0?'over':'under')+'">'+money(n)+'</span>'; };
  const head='<tr><th class="l">Cost Code</th><th class="l">Type</th><th>Revised Budget</th><th>Job to Date Cost</th>'
    +'<th>Committed</th><th>Cost at Completion</th><th>Savings / (Loss)</th></tr>';
  const body=list.map(x=>'<tr><td class="l">'+esc(x.code)+'</td><td class="l">'+esc(x.type)+'</td>'
    +'<td>'+money(x.budget)+'</td><td>'+money(x.cost)+'</td><td>'+money(x.committed)+'</td>'
    +'<td>'+money(x.eac)+'</td><td>'+sv(x.save)+'</td></tr>').join('');
  const tot='<tr style="font-weight:bold;background:#f7f9fc"><td class="l">Total &mdash; '+list.length+' cost codes</td><td></td>'
    +'<td>'+money(T('budget'))+'</td><td>'+money(T('cost'))+'</td><td>'+money(T('committed'))+'</td>'
    +'<td>'+money(T('eac'))+'</td><td>'+sv(T('budget')-T('eac'))+'</td></tr>';
  const lbl=(DFILE.current.label?esc(DFILE.current.label):'Current budget view');
  wrap.innerHTML='<div class="vizbox" style="padding:11px 13px 13px"><div class="vt">Cost codes &mdash; '+lbl+'</div>'
    +'<div class="vs">Live budget view, not a reviewed month-end snapshot. Savings / (Loss) = revised budget &minus; cost at completion.</div>'
    +'<div class="rwrap"><table class="rtable"><thead>'+head+'</thead><tbody>'+body+tot+'</tbody></table></div></div>';
}
/* ===================== Budget Snapshot Analysis ==========================
   One job, two snapshots, compared budget code by budget code - the same view
   Spark's Budget Projections screen gives. The rows are written per project by
   import_snapshot_lines.js, and only the selected job's file is fetched, so the
   page cost stays flat as jobs are added.
   A stored row is [revised budget, job-to-date cost, committed, EAC]. The
   comparison is on EAC: that is the number the month-end review turns on, and
   the one Spark puts side by side. */
const EAC_IDX=3;
const money2=n=>(n||n===0)?'$ '+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'&mdash;';
/* Spark's sign convention, kept deliberately: Variance = Snapshot 1 - Snapshot 2.
   Positive means the estimate came DOWN between the two (money back); negative
   means it grew, and shows red in parentheses exactly as the source screen does. */
function vcell(n){ n=num(n); if(!Math.round(n*100)) return '<span class="muted">&mdash;</span>';
  return n>0 ? '<span class="funder">'+money2(n)+'</span>'
             : '<span class="fover">( '+money2(Math.abs(n))+' )</span>'; }
function snapLabel(s){
  if(!s) return '';
  if(String(s.id)==='current') return 'Current (live)';
  const base=s.label||monthName(s.month||'')||('Snapshot '+s.id);
  return base+(/approv/i.test(s.approval||'')?'':' — '+(s.approval||'unapproved'));
}
function renderCompare(){
  const jobSel=document.getElementById('cmpJob'); if(!jobSel) return;
  const meta=document.getElementById('cmpMeta'), out=document.getElementById('cmpList');
  const list=(SNAPIDX&&SNAPIDX.projects)||[];
  if(!list.length){
    jobSel.innerHTML=''; ['cmpA','cmpB'].forEach(id=>{const e=document.getElementById(id); if(e) e.innerHTML='';});
    if(meta) meta.textContent='';
    out.innerHTML='<div class="empty">No budget-code snapshot data yet. Run the <b>Budget snapshot LINES import</b> workflow &mdash; it writes <b>snapshot_lines/</b> into the same SharePoint folder &mdash; then reload this page.</div>';
    return; }
  if(!CMPJOB||!list.some(p=>p.job_no===CMPJOB)) CMPJOB=list[list.length-1].job_no;
  jobSel.innerHTML=list.map(p=>'<option value="'+esc(p.job_no)+'">'+esc(p.job_no)+' — '+esc(p.job_name||'')+'</option>').join('');
  jobSel.value=CMPJOB;
  cmpLoadJob();
}
async function cmpLoadJob(){
  const out=document.getElementById('cmpList'); if(!out) return;
  if(CMPFILE&&CMPFILE.job_no===CMPJOB){ cmpFill(); return; }
  if(CMPBUSY) return; CMPBUSY=true;
  out.innerHTML='<div class="loading">Loading budget codes for '+esc(CMPJOB)+'&hellip;</div>';
  try{
    const token=await getToken(); if(!token){ CMPBUSY=false; return; }
    const r=await fetchFile(token, SNAPLINES_DIR+'/'+CMPJOB+'.json');
    if(!r.ok) throw new Error('Graph HTTP '+r.status);
    CMPFILE=await r.json();
  }catch(e){ CMPFILE=null; CMPBUSY=false;
    out.innerHTML='<div class="empty">Could not load budget codes for '+esc(CMPJOB)+': '+esc((e&&e.message)||e)+'</div>'; return; }
  CMPBUSY=false; CMPA=''; CMPB=''; cmpFill();
}
/* Newest first, with the live budget at the top when the import captured one. */
function cmpSnaps(){ if(!CMPFILE) return [];
  const arr=(CMPFILE.snapshots||[]).slice().reverse();
  return CMPFILE.current ? [CMPFILE.current].concat(arr) : arr; }
function cmpFill(){
  const a=document.getElementById('cmpA'), b=document.getElementById('cmpB'); if(!a||!b) return;
  const snaps=cmpSnaps();
  if(!snaps.length){ a.innerHTML=''; b.innerHTML='';
    document.getElementById('cmpList').innerHTML='<div class="empty">No snapshots stored for this job yet.</div>'; return; }
  const opts=snaps.map(s=>'<option value="'+esc(String(s.id))+'">'+esc(snapLabel(s))+'</option>').join('');
  a.innerHTML=opts; b.innerHTML=opts;
  // Default to the most recent pair: Snapshot 2 = newest (Current when present), Snapshot 1 = the one before it.
  if(!CMPA||!snaps.some(s=>String(s.id)===CMPA)) CMPA=String((snaps[1]||snaps[0]).id);
  if(!CMPB||!snaps.some(s=>String(s.id)===CMPB)) CMPB=String(snaps[0].id);
  a.value=CMPA; b.value=CMPB;
  const cv=document.getElementById('cmpVar'); if(cv) cv.checked=CMPVARONLY;
  cmpTable();
}
function cmpRows(){
  if(!CMPFILE) return null;
  const snaps=cmpSnaps();
  const A=snaps.find(s=>String(s.id)===CMPA), B=snaps.find(s=>String(s.id)===CMPB);
  if(!A||!B) return null;
  const codes=CMPFILE.codes||{};
  const keys=[...new Set(Object.keys(A.rows||{}).concat(Object.keys(B.rows||{})))].sort();
  const rows=keys.map(k=>{
    const ra=(A.rows||{})[k], rb=(B.rows||{})[k];
    const va=ra?num(ra[EAC_IDX]):0, vb=rb?num(rb[EAC_IDX]):0;
    return { code:k, desc:(codes[k]&&codes[k].d)||'', type:(codes[k]&&codes[k].t)||'',
             a:va, b:vb, v:va-vb, onlyA:!rb, onlyB:!ra };
  });
  return {A:A,B:B,rows:rows};
}
function cmpTable(){
  const out=document.getElementById('cmpList'), meta=document.getElementById('cmpMeta'); if(!out) return;
  const d=cmpRows();
  if(!d){ out.innerHTML='<div class="empty">Pick two snapshots to compare.</div>'; if(meta) meta.textContent=''; return; }
  /* Totals are over EVERY code, not the filtered view - "show only variances" hides
     rows that did not move, it does not change what the job is projected to cost. */
  const totA=d.rows.reduce((t,r)=>t+num(r.a),0), totB=d.rows.reduce((t,r)=>t+num(r.b),0);
  const moved=d.rows.filter(r=>Math.round(r.v*100)!==0);
  const shown=CMPVARONLY?moved:d.rows;
  if(meta) meta.innerHTML=esc(CMPFILE.job_no||'')+' '+esc(CMPFILE.job_name||'')
    +'  ·  '+d.rows.length+' budget codes, '+moved.length+' moved'
    +(String(d.B.id)==='current'?'  ·  <span class="chip" style="background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e" title="Snapshot 2 is the live budget view, not an approved month-end record.">Current is live, not reviewed</span>':'')
    +(CMPFILE.generated_at?('  ·  captured '+new Date(CMPFILE.generated_at).toLocaleString()):'');
  const th=(s,tot)=>'<th style="text-align:right">'+esc(snapLabel(s))+'<div style="font-weight:400;font-size:11px;color:#7a828f">Estimate at Completion</div><div style="color:#1F3864">'+money2(tot)+'</div></th>';
  const head='<tr><th class="l">Budget Code</th><th class="l">Type</th><th class="l">Budget Code Description</th>'

    pE:num(r.projected_cost)||null,cE:null,markup:false,eac:false};
  const cC=num(r.ce.ce_contract), dC=pC-cC;

/* ---------------- MONTHLY EAC WORKLIST (Procore <-> CE) ----------------------
   The Estimate-at-Completion lives in Procore's cost projections and has to be
   re-entered in CE each month. Nothing pushes it automatically, so CE drifts and
   every CE-derived figure - % complete, projected margin, revenue recognised -
   drifts with it. The reconciliation tiles above say a gap EXISTS; this says what
   to do about each one, in the order worth doing.

   Three different jobs, deliberately not merged into one number:
     - "Update CE"      both systems have an EAC and they disagree
     - "Push to CE"     Procore has one, CE has none
     - "Project first"  CE has one, PROCORE has none - the projection was never
                        made, so there is nothing to copy and the PM has to build
                        it in Procore before this row can be closed
   And a warning that must not be automated away: where Procore's EAC is a small
   fraction of the contract while CE's is near it, PROCORE is the stale side (22-659
   is the live example - $11.2M EAC against a $35.9M contract). Copying that into CE
   would destroy a good number with a bad one. Those rows say "check Procore first".

   No new data and no new API calls: projected_cost and ce_projected_cost are both
   already loaded, and the PM comes from the Procore team array already on the row. */
function pmOf(r){
  const t=(r.team||[]).filter(x=>x&&x.name);
  const pm=t.find(x=>/project manager/i.test(x.role||'')) || t.find(x=>/superintendent/i.test(x.role||''));
  return pm?pm.name:'';
}
function eacWorkRows(list){
  const out=[];
  for(const r of list){
    if(!r.ce) continue;                                  // not in CE at all - a different problem
    const con=num(r.revised_contract||r.contract_amount);
    const pE=num(r.projected_cost), cE=num(r.ce.ce_projected_cost);
    const tol=Math.max(5000, pE*0.01);
    let action='', why='', cls='';
    if(pE>0 && cE>0){
      if(Math.abs(pE-cE)<=tol) continue;                 // already in sync
      action='Update CE'; cls='w';
      /* Procore materially BELOW contract while CE sits near it = Procore never finished
         its projection. Flag rather than exclude: it is still a gap, just not this one. */
      if(con>0 && pE < con*0.6 && cE >= con*0.8){
        action='Check Procore first'; cls='r';
        why='Procore EAC is '+Math.round(pE/con*100)+'% of contract while CE is '+Math.round(cE/con*100)+'% — Procore looks stale, not CE. Do not copy this into CE.';
      }
    } else if(pE>0 && !(cE>0)){ action='Push to CE'; cls='w'; why='CE holds no EAC for this job.'; }
    else if(!(pE>0) && cE>0){ action='Project in Procore first'; cls='r';
      why='Procore has no cost projection, so there is nothing to push. The PM has to build it in Procore.'; }
    else continue;                                        // neither has one
    out.push({r, con, pE, cE, d:(pE>0&&cE>0)?(pE-cE):null, action, why, cls, pm:pmOf(r)});
  }
  return out.sort((a,b)=>Math.abs(b.d||b.pE||b.cE||0)-Math.abs(a.d||a.pE||a.cE||0));
}

    +'<td>'+m(c.pC)+'</td><td>'+m(c.cC)+'</td><td>'+dCell+'</td>'
    +'<td>'+m(c.pCost)+'</td><td>'+m(c.cCost)+'</td>'
    +'<td>'+m(c.pCom)+'</td><td>'+m(c.cCom)+'</td>'
    +'<td>'+m(c.pE)+'</td><td>'+m(c.cE)+'</td>'
    +'<td class="l rstat '+sc+'">'+esc(c.status)+'</td></tr>';
}
function renderProf(list){
  const withCe=list.filter(r=>r.ce);
  const S=f=>withCe.reduce((a,r)=>a+num(r.ce[f]),0);
  const totContract=S('ce_contract'), totCost=S('ce_actual_cost'), totCommitted=S('ce_committed'), totEac=S('ce_projected_cost'), totBilled=S('ce_billed'), totMargin=S('ce_projected_margin'), totOU=S('ce_over_under_billed');
  const marginPct=totContract?(totMargin/totContract*100):null;
  const totRev=withCe.reduce((a,r)=>{const p=projOf(r);return a+(p?p.revRec:0);},0);
  const totRemain=withCe.reduce((a,r)=>{const p=projOf(r);return a+(p?p.remaining:0);},0);
  document.getElementById('profCards').innerHTML=
    card('total',money(totContract),'Contract',null,'CE current contract (incl. approved changes), summed across shown jobs with a CE match.')
   +card('co',money(totCost),'Cost to Date',null,'CE actual incurred cost (excludes committed).')
   +card('rfi',money(totCommitted),'Committed',null,'CE committed — executed subs/POs not yet incurred.')
   +card('nc',money(totEac),'Projected Cost (EAC)',null,'CE projected final cost at completion.')
   +card(totMargin<0?'nc':'ok',smoney(totMargin)+(marginPct!=null?' · '+marginPct.toFixed(1)+'%':''),'Projected Fee / Margin',null,'Contract − Projected Cost (EAC). Fee = margin = profit.')
   +card('ok',money(totRev),'Revenue Recognized',null,'% Complete × Contract, summed — revenue earned to date.')
   +card('total',money(totRemain),'Remaining Revenue',null,'Contract − Revenue Recognized — backlog left to earn/bill.')
   +card('soon',money(totBilled),'Billed to Date',null,'CE amount billed to the owner to date.')
   +card(totOU<0?'total':'ok',(totOU<0?'Under ':'Over ')+money(Math.abs(totOU)),'Net Over/Under Billed',null,'Billed − earned (cost-based). Under = billing behind cost progress.');
  if(typeof Chart!=='undefined'){
    const j1=withCe.slice().sort((a,b)=>num(b.ce.ce_contract)-num(a.ce.ce_contract)).slice(0,15);
    const c1=document.getElementById('cccChart');
    if(c1){ if(CCCChart)CCCChart.destroy();
      CCCChart=new Chart(c1,{type:'bar',data:{labels:j1.map(r=>r.project_number),datasets:[
        {label:'Contract',data:j1.map(r=>num(r.ce.ce_contract)),backgroundColor:'#1F3864'},
        {label:'Cost to Date',data:j1.map(r=>num(r.ce.ce_actual_cost)),backgroundColor:'#ED2B30'},
        {label:'Committed',data:j1.map(r=>num(r.ce.ce_committed)),backgroundColor:'#c99a00'}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+': $'+Math.round(c.parsed.y).toLocaleString()}}},scales:{y:{ticks:{callback:v=>'$'+(v/1e6).toFixed(1)+'M'}},x:{ticks:{maxRotation:60,minRotation:45,font:{size:9}}}}}});
    }
    const j2=withCe.slice().filter(r=>r.ce.ce_projected_margin_pct!=null).sort((a,b)=>num(b.ce.ce_projected_margin_pct)-num(a.ce.ce_projected_margin_pct));
    const c2=document.getElementById('marginChart');
    if(c2){ if(MARGINChart)MARGINChart.destroy();
      const mp=j2.map(r=>num(r.ce.ce_projected_margin_pct));
      MARGINChart=new Chart(c2,{type:'bar',data:{labels:j2.map(r=>r.project_number),datasets:[
        {label:'Margin %',data:mp,backgroundColor:mp.map(v=>v<0?'#b3261e':(v<TARGET_MARGIN?'#c99a00':'#1a7f37'))},
        {type:'line',label:'Target',data:j2.map(()=>TARGET_MARGIN),borderColor:'#5b6472',borderDash:[6,4],borderWidth:1.5,pointRadius:0}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(c.datasetIndex===0?'Margin ':'Target ')+Number(c.parsed.y).toFixed(1)+'%'}}},scales:{y:{ticks:{callback:v=>v+'%'}},x:{ticks:{maxRotation:60,minRotation:45,font:{size:9}}}}}});
    }
  }
  document.getElementById('profList').innerHTML = withCe.length ? withCe.map(pcardProf).join('')
    : '<div class="empty">No CE job data for the current filter. (Matched by job number — bids and jobs not yet in ComputerEase won\'t appear.)</div>';
}
function isRpt(r){ return !!(r.ce && r.ce.ce_source==='wip_report'); }
function rptChip(r){ return isRpt(r)?'<span class="chip" style="background:#E7F0FF;color:#1F3864;border:1px solid #b9cdf0" title="These CE figures come from a Work-in-Progress report export, not the live CE API — this job isn’t published to the API yet. Committed cost isn’t available from the report. Refresh by re-exporting the WIP report from CE.">CE (report)</span>':''; }
function pcardProf(r){
  const c=r.ce; const mNeg=num(c.ce_projected_margin)<0; const ouNeg=num(c.ce_over_under_billed)<0; const pid=r.procore_id;
  const trueContract = r.markup_gap ? num(r.revised_contract||r.contract_amount) : num(c.ce_contract);
  const pill='<span class="pright"><span class="pill '+(mNeg?'r':'g')+'">'+(mNeg?'Projected loss':'Margin '+(c.ce_projected_margin_pct!=null?Number(c.ce_projected_margin_pct).toFixed(1)+'%':''))+'</span></span>';
  return '<div class="pcard fin '+(mNeg?'o':'u')+'">'
    +'<div class="phead"><span class="pname"><a href="'+pcBase(pid)+'/tools/budgeting" target="_blank">'+esc(r.project)+'</a></span><span class="pnum">'+esc(r.project_number)+'</span><span class="chip stage">'+esc(r.stage)+'</span>'
    +rptChip(r)
    +(r.markup_gap?'<span class="chip" style="background:#FFC7CE;color:#9C0006;border:1px solid #e6a3a3" title="Procore contract exceeds CE by '+money(r.markup_gap)+' — fee/CO markup is handled in Procore in a way Spark isn\'t exporting, so CE is short. Margin, revenue recognized &amp; projection below are understated by up to this amount until it syncs.">&#9888; CE missing markup '+smoney(r.markup_gap)+'</span>':'')
    +(r.eac_gap?'<span class="chip" style="background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e" title="Procore Estimate-at-Completion differs from CE by '+smoney(r.eac_gap)+' — the latest Procore cost projection may not be imported into CE yet (Enter Revised Estimates). CE EAC / %complete / margin here may be stale.">&#9888; EAC not synced '+smoney(r.eac_gap)+'</span>':'')
    +pill+'</div>'
    +'<div class="pgrid">'
    +kv('Contract (CE)','<span class="money">'+money(c.ce_contract)+'</span>','CE current contract incl. approved changes.')
    +(r.markup_gap?kv('Contract (Procore)','<span class="money" style="color:#1a7f37">'+money(trueContract)+'</span> <span style="color:#9C0006;font-size:11px;white-space:nowrap">(+'+smoney(r.markup_gap)+' missing)</span>','TRUE contract = CE contract ('+money(c.ce_contract)+') + '+smoney(r.markup_gap)+' of fee/CO markup not yet synced into CE ('+money(trueContract)+' total, from Procore).'):'')
    +kv('Billed to Date','<span class="money">'+money(c.ce_billed)+'</span>','CE amount billed to the owner to date.')
    +kv('Cost to Date','<span class="money">'+money(c.ce_actual_cost)+'</span>','CE actual incurred cost (excludes committed).')
    +kv('Committed',c.ce_committed==null?'<span style="color:#8a94a3">n/a (report)</span>':'<span class="money">'+money(c.ce_committed)+'</span>',c.ce_committed==null?'Committed cost isn\'t available — this job is WIP-report-sourced and no subcontract export was provided.':'CE committed — executed subs/POs not yet incurred.'+(c.ce_committed_source==='sub_report'?' Derived from the subcontract report (≈ the API committed within ~2%).':''))
    +kv('Projected Cost (EAC)','<span class="money">'+money(c.ce_projected_cost)+'</span>','CE projected final cost at completion.')
    +kv('Projected Fee / Margin','<span class="'+(mNeg?'fover':'funder')+'">'+smoney(c.ce_projected_margin)+(c.ce_projected_margin_pct!=null?' · '+Number(c.ce_projected_margin_pct).toFixed(1)+'%':'')+'</span>','Contract ('+money(c.ce_contract)+') − Projected Cost ('+money(c.ce_projected_cost)+'). Fee = margin = profit.')
    +kv('% Complete',(c.ce_pct_complete!=null?Math.round(c.ce_pct_complete)+'%':'—'),'Cost-based: Cost to Date ('+money(c.ce_actual_cost)+') ÷ Projected Cost ('+money(c.ce_projected_cost)+').')
    +kv('Revenue Recognized','<span class="money">'+money((projOf(r)||{}).revRec)+'</span>','% Complete × Contract — revenue earned to date.')
    +kv('Remaining Revenue','<span class="money">'+money((projOf(r)||{}).remaining)+'</span>','Contract − Revenue Recognized — backlog left to earn/bill.')
    +kv('Over/Under Billed','<span class="'+(ouNeg?'fover':'funder')+'">'+(ouNeg?'Under ':'Over ')+money(Math.abs(num(c.ce_over_under_billed)))+'</span>','Billed ('+money(c.ce_billed)+') − earned (Contract × % complete). Under = billing behind cost progress.')
    +'</div>'
    +'<div class="srclinks"><a href="'+pcBase(pid)+'/tools/budgeting" target="_blank">Procore budget</a></div>'
    +'</div>';
}
function card(cls,n,label,flag,tip){
  const t=tip?' title="'+esc(tip)+'"':'';
  if(flag==null) return '<div class="card noclk '+cls+'"'+t+'><div class="n">'+n+'</div><div class="l">'+label+'</div></div>';
  const cur=(document.getElementById('fFlag')||{}).value;
  const sel=(cur===flag)?' sel':'';
  return '<div class="card clk '+cls+sel+'" onclick="setFlag(\''+flag+'\')"'+t+'><div class="n">'+n+'</div><div class="l">'+label+'</div></div>';
}
function setFlag(f){ const el=document.getElementById('fFlag'); const cur=el.value; el.value=(cur===f)?'':f; onStruct(); }
function kv(k,v,tip){ const t=tip?' title="'+esc(tip)+'"':''; const kc=tip?'k tip':'k'; return '<div'+t+'><div class="'+kc+'">'+k+'</div><div class="v">'+v+'</div></div>'; }
/* Summary card — team / owner / schedule / compliance (no financials) */

  const cls=compClass(r); const c=r.compliance;

    +(c?'<a href="https://compliance.baileyharris.com" target="_blank">Compliance ('+c.compliant+'/'+c.vendors+' ok)</a>':'')+'</div>'

/* Financials tab */
// ---- As-of month overlay (accounting): Financials from Procore approved snapshots, WIP from CE history ----
function asofMonths(){ const a=new Set(); if(MONTHLY&&MONTHLY.months) MONTHLY.months.forEach(m=>a.add(m)); if(CEHIST&&CEHIST.months) CEHIST.months.forEach(m=>a.add(m)); return [...a].sort(); }
function populateAsof(){ const months=asofMonths(); const opts='<option value="live">Live (current)</option>'+months.slice().reverse().map(m=>'<option value="'+m+'">As of '+monthName(m)+'</option>').join('');
  for(const id of ['finAsof','profAsof','dAsof']){ const el=document.getElementById(id); if(!el) continue; if(el.options.length!==months.length+1) el.innerHTML=opts; el.value=(ASOF==='live'||months.includes(ASOF))?ASOF:'live'; } }
function setAsof(v){ ASOF=v; render(); }
function asofFin(rows){ const s=MONTHLY&&MONTHLY.snapshots&&MONTHLY.snapshots[ASOF]; if(!s) return null; const m={}; for(const j of s.jobs) m[String(j.job_no)]=j;
  return rows.filter(r=>m[String(r.project_number)]).map(r=>{ const j=m[String(r.project_number)]; const contract=num(j.projected_contract), eac=num(j.eac);
    return Object.assign({},r,{ revised_contract:contract, contract_amount:contract, approved_cos:0, pending_cos:0, budget_revised:contract, projected_cost:eac, cost_to_date:num(j.cost_to_date), committed:num(j.committed), projected_margin:contract-eac, projected_margin_pct:contract?((contract-eac)/contract*100):null, over_under_budget:contract-eac, pct_complete:(j.pct_complete!=null?num(j.pct_complete)*(num(j.pct_complete)<=1?100:1):null), cost_source:'Approved snapshot '+ASOF }); }); }
function asofProf(rows){ const s=CEHIST&&CEHIST.snapshots&&CEHIST.snapshots[ASOF]; if(!s) return null; const m={}; for(const j of s.jobs) m[String(j.job_code)]=j;
  return rows.map(r=>Object.assign({},r,{ce:m[String(r.project_number)]||null})).filter(r=>r.ce); }
function renderFin(list){
  const totContract=list.reduce((a,r)=>a+num(r.revised_contract||r.contract_amount),0);
  const totEac=list.reduce((a,r)=>a+num(r.projected_cost),0);
  const totMargin=list.reduce((a,r)=>a+num(r.projected_margin),0);
  const totCommitted=list.reduce((a,r)=>a+num(r.committed),0);
  const totJtd=list.reduce((a,r)=>a+num(r.cost_to_date),0);
  const loss=list.filter(r=>r.projected_cost&&r.projected_margin<0);
  const marginPct=totContract?(totMargin/totContract*100):null;
  document.getElementById('finCards').innerHTML=
    card('total',money(totContract),'Total Contract (rev.)',null,'REVENUE — sum of each shown project’s Revised Contract, from the Procore prime contracts.')
   +card('co',money(totEac),'Projected Cost (EAC)',null,'COST — sum of Estimate at Completion from the Cost Projections budget view (projected total cost to build).')
   +card(totMargin<0?'nc':'ok',smoney(totMargin)+(marginPct!=null?' · '+marginPct.toFixed(1)+'%':''),'Projected Margin',null,'Revised Contract − Projected Cost (EAC) across shown projects. Negative = projected loss.')
   +card('soon',loss.length,'Projects at Loss','over','Shown active projects where Projected Cost exceeds Revised Contract (projected margin negative). Click to filter.')
   +card('rfi',money(totCommitted),'Committed',null,'COST — sum of Commitments (SUB/PO/PSA): executed subcontract & PO value.')
   +card('co',money(totJtd),'Cost to Date',null,'COST — sum of Job to Date Costs (actual cost incurred so far).');
  document.getElementById('finVar').innerHTML = loss.length
    ? '<div class="varbox"><b>&#9888; Projected loss ('+loss.length+')</b><div style="margin-top:7px;line-height:1.7">'
        +loss.map(r=>'<a href="'+pcBase(r.procore_id)+'/tools/budgeting" target="_blank" style="color:#211E1E;text-decoration:none;font-weight:600">'+esc(r.project)+'</a> — <span class="fover">'+smoney(r.projected_margin)+'</span> <span style="color:#7a828f">(projected cost '+money(r.projected_cost)+' vs contract '+money(r.revised_contract||r.contract_amount)+')</span>').join('<br>')
        +'</div></div>'
    : '<div class="varbox clean"><b>&#10003; No projects projected to lose money</b> <span style="color:#7a828f">— Projected Cost (EAC) is within contract on all shown active jobs.</span></div>';
  document.getElementById('finList').innerHTML = list.length ? list.map(fcard).join('')
    : (ASOF!=='live'
        ? '<div class="empty"><b>No Procore snapshot captured any job for '+esc(monthName(ASOF))+'.</b><br>The zeros above are an empty month, not missing data. Switch <b>As of</b> back to <i>Live (current)</i>, or pick a month that has snapshots.</div>'
        : '<div class="empty">No projects match the current filters.</div>');
}
function fcard(r){
  const hasCost=!!r.projected_cost;
  const marginNeg = r.projected_margin<0;
  const overCls = hasCost ? (marginNeg?'o':'u') : '';
  const pill = hasCost
    ? '<span class="pright"><span class="pill '+(marginNeg?'r':'g')+'">'+(marginNeg?'Projected loss':'Margin '+(r.projected_margin_pct!=null?r.projected_margin_pct.toFixed(1)+'%':''))+'</span></span>'
    : '';
  const marginCell = hasCost ? '<span class="'+(marginNeg?'fover':'funder')+'">'+smoney(r.projected_margin)+(r.projected_margin_pct!=null?' · '+r.projected_margin_pct.toFixed(1)+'%':'')+'</span>' : '—';
  const pctCell = (r.pct_complete!=null)? Math.round(r.pct_complete)+'%' : '—';
  const ouCell = hasCost ? '<span class="'+(r.over_under_budget<0?'fover':'funder')+'">'+(r.over_under_budget<0?'Over ':'Under ')+money(Math.abs(r.over_under_budget))+'</span>' : '—';
  const pid=r.procore_id; const s={contract:pcBase(pid)+'/tools/prime-contracts',budget:pcBase(pid)+'/tools/budgeting',project:pcOverview(pid)};
  const src=r.cost_source||'';
  const srcShort=/subcontractor/i.test(src)?'Cost Projections view':(/ce.?import/i.test(src)?'CE Import (contract mirror)':(src||'—'));
  const srcChip = hasCost
    ? '<span class="chip" style="background:#eef2f8;color:#5b6472;border:1px solid #d6deea" title="Procore cost figures pulled from budget view: '+esc(src)+'">src: '+esc(srcShort)+'</span>'
    : '<span class="chip" style="background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e" title="No cost found in a Procore budget view'+(src?(' (view read: '+esc(src)+')'):'')+' — this job may track cost only in Direct Costs / ComputerEase.">&#9888; no Procore cost</span>';
  return '<div class="pcard fin '+overCls+'">'
    +'<div class="phead"><span class="pname"><a href="'+esc(s.project)+'" target="_blank">'+esc(r.project)+'</a></span><span class="pnum">'+esc(r.project_number)+'</span>'
    +'<span class="chip stage">'+esc(r.stage)+'</span>'+srcChip+pill+'</div>'
    +'<div class="pgrid">'
    +kv('Contract','<span class="money">'+money(r.contract_amount)+'</span>','REVENUE — Procore prime contract grand_total (original contract, before COs).')
    +kv('Approved COs','<span class="money">'+money(r.approved_cos)+'</span>','REVENUE — prime contract approved_change_orders.')
    +kv('Pending COs','<span class="money">'+money(r.pending_cos)+'</span>','REVENUE — prime contract pending_change_orders_amount (not yet approved).')
    +kv('Revised Contract','<span class="money">'+money(r.revised_contract)+'</span>','REVENUE — revised_contract_amount = Contract ('+money(r.contract_amount)+') + Approved COs ('+money(r.approved_cos)+').')
    +kv('Committed','<span class="money">'+money(r.committed)+'</span>','COST — Commitments (SUB/PO/PSA): executed subcontract & PO value (Cost Projections view).')
    +kv('Cost to Date','<span class="money">'+money(r.cost_to_date)+'</span>','COST — Job to Date Costs: actual cost incurred so far (matches CE actual cost).')
    +kv('Projected Cost (EAC)','<span class="money">'+money(r.projected_cost)+'</span>','COST — Estimate at Completion: projected total cost to finish the job.')
    +kv('Projected Margin',marginCell,'Revised Contract ('+money(r.revised_contract||r.contract_amount)+') − Projected Cost ('+money(r.projected_cost)+'). Negative = projected loss.')
    +kv('% Complete',pctCell,'Cost-based: Cost to Date ('+money(r.cost_to_date)+') ÷ Projected Cost ('+money(r.projected_cost)+').')
    +kv('Over/Under Budget',ouCell,'Revised Budget ('+money(r.budget_revised)+') − Projected Cost ('+money(r.projected_cost)+'). Note: on this view the budget mirrors the contract.')
    +kv('COs approved this mo',(r.cos_approved_this_month||0)+(r.cos_approved_this_month_amt?' · '+money(r.cos_approved_this_month_amt):''),'Prime (owner-side) change-order packages approved/executed this calendar month. Count · total.')
    +kv('Commitment COs (cost)','<span class="money">'+smoney(r.commitment_cos)+'</span>','COST — approved commitment (subcontract/PO) change orders. Can be negative when deductive.')
    +kv('Commitment COs this mo',(r.commitment_cos_this_month||0)+(r.commitment_cos_this_month_amt?' · '+smoney(r.commitment_cos_this_month_amt):''),'Approved commitment change orders this calendar month. Count · total.')
    +'</div>'
    +'<div class="srclinks"><a href="'+esc(s.contract)+'" target="_blank">Prime contract / COs</a><a href="'+esc(s.budget)+'" target="_blank">Budget (Cost Projections)</a><a href="'+esc(s.project)+'" target="_blank">Procore project</a></div>'
    +'</div>';
}
load();
