<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Montserrat',Arial,sans-serif;background:#f5f7fa;color:#211E1E}
  .bh-topbar{height:4px;background:#ED2B30;width:100%}
  .bh-banner{background:#fff;border-bottom:1px solid #E8E6E7;width:100%}
  .bh-banner-inner{max-width:1300px;margin:0 auto;padding:12px 20px 14px;display:flex;align-items:center;gap:18px}
  .bh-logo{height:54px;width:auto;flex:none}
  .bh-title{color:#211E1E;font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .bh-sub{color:#5b6472;font-size:12.5px;margin-top:3px}
  .bh-badge{margin-left:auto;border:1px solid #1a7f37;color:#1a7f37;background:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:bold;letter-spacing:.05em;white-space:nowrap}
  .wrap{max-width:1300px;margin:0 auto;padding:20px}
  .banner{background:#fff7e6;border:1px solid #f0d089;color:#7a5a12;padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .err{background:#FFC7CE;border-color:#e6a3a3;color:#9C0006}
  #map{height:380px;border-radius:12px;border:1px solid #e3e8f0;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .controls label{font-size:13px;color:#40485a;font-weight:bold}
  select,input[type=text]{padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;font-size:14px;background:#fff}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:13px 15px;cursor:pointer}
  .card .n{font-size:24px;font-weight:bold}.card .l{font-size:11px;color:#5b6472;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .card.total .n{color:#7F1B29}.card.soon .n{color:#9a6a00}.card.ok .n{color:#1a7f37}.card.rfi .n{color:#1a4fb0}.card.co .n{color:#484B4D}
  .pcard{background:#fff;border:1px solid #e3e8f0;border-left:6px solid #484B4D;border-radius:10px;padding:12px 16px;margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .pcard.g{border-left-color:#1a7f37}.pcard.y{border-left-color:#c99a00}.pcard.r{border-left-color:#b3261e}
  .phead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .pname{font-weight:bold;font-size:15px;color:#211E1E}
  .pname a{color:inherit;text-decoration:none}.pname a:hover{color:#ED2B30;text-decoration:underline}
  .pnum{font-size:12px;color:#5b6472}
  .chip{padding:1px 8px;border-radius:999px;font-size:10px;font-weight:bold;white-space:nowrap}
  .chip.stage{background:#eef2f8;color:#1F3864;border:1px solid #cfe0f3}
  .chip.sect{background:#f1efe9;color:#6a5a3a;border:1px solid #e2d9c7}
  .chip.close{background:#FFE9C7;color:#8a5a00;border:1px solid #f0cf8e}
  .chip.sp{background:#ECE7F5;color:#4a2f7a;border:1px solid #d6c8ee}
  .pright{margin-left:auto;display:flex;gap:8px;align-items:center}
  .pill{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:bold}
  .pill.g{background:#C6EFCE;color:#006100}.pill.y{background:#FFEB9C;color:#9C6500}.pill.r{background:#FFC7CE;color:#9C0006}.pill.n{background:#eef1f6;color:#8a92a1}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 18px;margin-top:9px;font-size:12.5px}
  .pgrid .k{color:#7a828f;font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;font-weight:700}
  .pgrid .v{color:#2b3240}
  .team{margin-top:8px;font-size:12px;color:#40485a;border-top:1px solid #f0f2f6;padding-top:7px}
  .team b{color:#211E1E}
  .money{font-variant-numeric:tabular-nums}
  .over{color:#b3261e;font-weight:bold}.under{color:#1a7f37;font-weight:bold}
  .srclinks{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .srclinks a{font-size:11px;color:#484B4D;border:1px solid #cfd6e0;border-radius:6px;padding:2px 8px;text-decoration:none;background:#fff}
  .srclinks a:hover{background:#484B4D;color:#fff}
  .empty{color:#5b6472;font-style:italic;padding:16px 0}
  .loading{padding:40px;text-align:center;color:#5b6472}
  footer{margin-top:26px;font-size:11.5px;color:#8a92a1;border-top:1px solid #e3e8f0;padding-top:12px;line-height:1.5}
  .tabs{display:flex;gap:2px;border-bottom:2px solid #e3e8f0;margin-bottom:16px}
  .tab{padding:9px 20px;font-size:14px;font-weight:700;color:#5b6472;cursor:pointer;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit}
  .tab.active{color:#ED2B30;border-bottom-color:#ED2B30}
  .panel{display:none}.panel.active{display:block}
  .ms{position:relative;display:inline-block}
  .ms-btn{padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;min-width:190px;text-align:left;font-family:inherit}
  .ms-btn:after{content:'▾';float:right;color:#8a92a1}
  .ms-panel{position:absolute;z-index:1000;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #c7cfdb;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:8px;width:320px;max-height:340px;overflow:auto;display:none}
  .ms-panel.open{display:block}
  .ms-tools{display:flex;gap:8px;margin-bottom:6px}
  .ms-tools button{font-size:11px;padding:3px 9px;border:1px solid #cfd6e0;border-radius:6px;background:#f5f7fa;cursor:pointer;font-family:inherit}
  .ms-search{width:100%;margin-bottom:6px}
  .ms-item{display:flex;align-items:center;gap:7px;padding:3px 4px;font-size:12.5px;cursor:pointer;border-radius:4px}
  .ms-item:hover{background:#f5f7fa}
  .fover{color:#b3261e;font-weight:bold}.funder{color:#1a7f37;font-weight:bold}
  .pcard.fin{border-left-color:#484B4D}.pcard.fin.o{border-left-color:#b3261e}.pcard.fin.u{border-left-color:#1a7f37}
  .varbox{background:#fff;border:1px solid #e3e8f0;border-left:5px solid #b3261e;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px}
  .varbox.clean{border-left-color:#1a7f37}
  .varbox b{color:#211E1E}
</style>

<script>
const MSAL_CLIENT_ID='1825a1c0-1ce3-4078-aeb7-a4714562c422';   // BH Dashboards app (hosts the desks)
const TENANT='848aa890-7982-4028-befa-3323d82583ce';
const SCOPES=['Sites.Selected','User.Read'];   // least-privilege: app granted to the Resources site only
const DRIVE_ID='b!UgjUeEqLf0e6Z37An3qt5NP_8dR2rQJBoZpkPrOgBP0b4x1AxB_JT5QG_didjvoe';
const PROJECTS_PATH='Compliance Dashboard/projects_data.json';
const SITE_PATH='baileyharris.sharepoint.com:/sites/Resources';   // Sites.Selected target
const CID=15326;
const pcBase=id=>'https://app.procore.com/webclients/host/companies/'+CID+'/projects/'+id;
const pcOverview=id=>pcBase(id)+'/tools/hubs/project-hub/views/overview';
let ROWS=[], GENERATED='', MAP=null, MARKERS=null, TAB='summary', SELECTED=null; /* SELECTED null = all projects */
const msalApp=new msal.PublicClientApplication({auth:{clientId:MSAL_CLIENT_ID,authority:'https://login.microsoftonline.com/'+TENANT,redirectUri:window.location.origin+window.location.pathname},cache:{cacheLocation:'sessionStorage'}});
async function getToken(){ await msalApp.initialize(); const redir=await msalApp.handleRedirectPromise(); let acct=(redir&&redir.account)||msalApp.getAllAccounts()[0]; if(!acct){ await msalApp.loginRedirect({scopes:SCOPES}); return null;} msalApp.setActiveAccount(acct); try{const t=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return t.accessToken;}catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES});return null;} }
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const money=n=>(n||n===0)?'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:0}):'—';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function fetchProjectsFile(token){
  const H={Authorization:'Bearer '+token};
  try{ const s=await fetch('https://graph.microsoft.com/v1.0/sites/'+SITE_PATH,{headers:H});
    if(s.ok){ const sid=(await s.json()).id;
      const r=await fetch('https://graph.microsoft.com/v1.0/sites/'+sid+'/drive/root:/'+encodeURI(PROJECTS_PATH)+':/content',{headers:H});
      if(r.ok) return r; } }catch(e){}
  return fetch('https://graph.microsoft.com/v1.0/drives/'+DRIVE_ID+'/root:/'+encodeURI(PROJECTS_PATH)+':/content',{headers:H});
}
async function load(){
  try{
    const token=await getToken(); if(!token) return;
    const res=await fetchProjectsFile(token);
    if(!res.ok) throw new Error('Graph HTTP '+res.status+' (need access to projects_data.json)');
    const data=await res.json(); ROWS=data.projects||[]; GENERATED=data.generated_at||'';
    document.getElementById('asof').textContent=GENERATED?('data as of '+new Date(GENERATED).toLocaleString()):'';
    buildUI();
  }catch(e){ const b=document.getElementById('banner'); b.style.display='block'; b.className='banner err'; b.textContent='Sign-in or data load failed: '+(e&&e.message||e); document.getElementById('content').innerHTML=''; }
}
function compClass(r){ const c=r.compliance; if(!c) return 'n'; if(c.noncompliant>0) return 'r'; if(c.expiring>0) return 'y'; if(c.fully_compliant) return 'g'; return 'n'; }
function buildUI(){
  const sectors=[...new Set(ROWS.map(r=>r.sector).filter(Boolean))].sort();
  const stages=[...new Set(ROWS.map(r=>r.stage).filter(Boolean))].sort();
  const offices=[...new Set(ROWS.map(r=>r.office).filter(Boolean))].sort();
  document.getElementById('content').innerHTML=
    '<div class="controls">'
   +'<label>Stage:</label><select id="fStage"><option value="">All</option>'+stages.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select>'
   +'<label>Sector:</label><select id="fSector"><option value="">All</option>'+sectors.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select>'
   +'<label>Office:</label><select id="fOffice"><option value="">All</option>'+offices.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select>'
   +'<label>Show:</label><select id="fFlag"><option value="">All</option><option value="close">Closing this month</option><option value="fc">Fully compliant</option><option value="nc">Has non-compliant subs</option><option value="rfi">Open RFIs</option><option value="over">Over budget</option></select>'
   +'<label>Projects:</label><span class="ms"><button type="button" id="msBtn" class="ms-btn">All projects</button>'
     +'<div id="msPanel" class="ms-panel"><div class="ms-tools"><button type="button" id="msAll">Select all</button><button type="button" id="msNone">Clear</button></div>'
     +'<input type="text" id="msSearch" class="ms-search" placeholder="find a project…"><div id="msList"></div></div></span>'
   +'<input id="q" type="text" placeholder="search project / owner / PM…" style="min-width:220px">'
   +'</div>'
   +'<div class="tabs"><button type="button" id="tabSum" class="tab active">Project Summary</button><button type="button" id="tabFin" class="tab">Project Financials</button></div>'
   +'<div id="panSum" class="panel active"><div id="map"></div><div class="cards" id="sumCards"></div><div id="sumList"></div></div>'
   +'<div id="panFin" class="panel"><div class="cards" id="finCards"></div><div id="finVar"></div><div id="finList"></div></div>';
  ['fStage','fSector','fOffice','fFlag'].forEach(id=>document.getElementById(id).addEventListener('input',onStruct));
  document.getElementById('q').addEventListener('input',render);
  document.getElementById('tabSum').addEventListener('click',()=>setTab('summary'));
  document.getElementById('tabFin').addEventListener('click',()=>setTab('financials'));
  // multiselect wiring
  document.getElementById('msBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('msPanel').classList.toggle('open');});
  document.getElementById('msPanel').addEventListener('click',e=>e.stopPropagation());
  document.addEventListener('click',()=>document.getElementById('msPanel').classList.remove('open'));
  document.getElementById('msSearch').addEventListener('input',msRebuild);
  document.getElementById('msAll').addEventListener('click',()=>{SELECTED=null;msRebuild();updateMsBtn();render();});
  document.getElementById('msNone').addEventListener('click',()=>{SELECTED=new Set();msRebuild();updateMsBtn();render();});
  document.getElementById('foot').innerHTML='Projects from Procore. Use the <b>Stage</b> filter for Construction / Pre-Con / Post-Con / Warranty / Post-Warranty / Bidding, and the <b>Projects</b> picker to focus on one or more jobs (defaults to all). <b>Project Summary</b> covers team, owner, architect, schedule &amp; compliance; <b>Project Financials</b> covers contract, change orders, budget &amp; variances. RFIs, change orders and budget are pulled for active jobs only. Compliance rollup from Billy + Alabama. Text search filters the list; the map reflects the Stage / Sector / Office / Projects filters. Source: SharePoint /Compliance Dashboard/projects_data.json.';
  MAP=L.map('map',{scrollWheelZoom:false}).setView([32.6,-85.6],7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(MAP);
  MARKERS=L.layerGroup().addTo(MAP);
  msRebuild(); updateMsBtn(); render();
}
function pinColor(cls){ return cls==='g'?'#1a7f37':cls==='y'?'#c99a00':cls==='r'?'#b3261e':'#5b6472'; }
function setTab(t){ TAB=t;
  document.getElementById('tabSum').classList.toggle('active',t==='summary');
  document.getElementById('tabFin').classList.toggle('active',t==='financials');
  document.getElementById('panSum').classList.toggle('active',t==='summary');
  document.getElementById('panFin').classList.toggle('active',t==='financials');
  if(t==='summary'&&MAP) setTimeout(()=>MAP.invalidateSize(),40);
}
/* ---------- filtering ---------- */
function structFiltered(){
  const fS=fSector.value,fT=fStage.value,fO=fOffice.value,fF=fFlag.value;
  let v=ROWS.filter(r=>(!fS||r.sector===fS)&&(!fT||r.stage===fT)&&(!fO||r.office===fO));
  if(fF==='close') v=v.filter(r=>r.closing_this_month);
  else if(fF==='fc') v=v.filter(r=>r.compliance&&r.compliance.fully_compliant);
  else if(fF==='nc') v=v.filter(r=>r.compliance&&r.compliance.noncompliant>0);
  else if(fF==='rfi') v=v.filter(r=>r.rfis_open>0);
  else if(fF==='over') v=v.filter(r=>r.budget_forecast&&r.budget_variance<0);
  return v;
}
function candIds(){ return new Set(structFiltered().map(r=>r.procore_id)); }
function selFiltered(){ const b=structFiltered(); return SELECTED?b.filter(r=>SELECTED.has(r.procore_id)):b; }
function listFiltered(){ const s=selFiltered(); const q=(document.getElementById('q').value||'').toLowerCase().trim();
  if(!q) return s;
  return s.filter(r=>((r.project||'')+' '+(r.owner||'')+' '+(r.architect||'')+' '+(r.project_number||'')+' '+((r.team||[]).map(t=>t.name).join(' '))).toLowerCase().includes(q)); }
function onStruct(){ SELECTED=null; msRebuild(); updateMsBtn(); render(); }
/* ---------- multiselect ---------- */
function msRebuild(){
  const term=(document.getElementById('msSearch').value||'').toLowerCase();
  const cand=structFiltered().slice().sort((a,b)=>String(a.project).localeCompare(String(b.project)));
  document.getElementById('msList').innerHTML = cand
    .filter(r=>!term||String(r.project).toLowerCase().includes(term)||String(r.project_number).toLowerCase().includes(term))
    .map(r=>{ const on=SELECTED?SELECTED.has(r.procore_id):true;
      return '<label class="ms-item"><input type="checkbox" data-id="'+r.procore_id+'"'+(on?' checked':'')+'>'
        +'<span>'+esc(r.project)+' <span style="color:#8a92a1">'+esc(r.project_number)+'</span></span></label>'; })
    .join('') || '<div class="empty" style="padding:8px">No projects</div>';
  document.querySelectorAll('#msList input[type=checkbox]').forEach(cb=>cb.addEventListener('change',msToggle));
}
function msToggle(e){
  const id=Number(e.target.getAttribute('data-id'));
  const ids=candIds();
  if(SELECTED===null) SELECTED=new Set(ids);
  if(e.target.checked) SELECTED.add(id); else SELECTED.delete(id);
  let all=true; ids.forEach(i=>{ if(!SELECTED.has(i)) all=false; });
  if(all) SELECTED=null;
  updateMsBtn(); render();
}
function updateMsBtn(){
  const ids=candIds(), n=ids.size;
  const sel=SELECTED?[...SELECTED].filter(i=>ids.has(i)).length:n;
  document.getElementById('msBtn').textContent=(SELECTED===null||sel===n)?('All projects ('+n+')'):(sel+' of '+n+' selected');
}
/* ---------- render ---------- */
function render(){
  const sel=selFiltered(), list=listFiltered();
  // ---- Summary tab ----
  const closing=list.filter(r=>r.closing_this_month).length, fc=list.filter(r=>r.compliance&&r.compliance.fully_compliant).length;
  const rfis=list.reduce((a,r)=>a+(r.rfis_open||0),0), cosm=list.reduce((a,r)=>a+(r.cos_approved_this_month||0),0);
  document.getElementById('sumCards').innerHTML=
    card('total',list.length,'Projects')+card('soon',closing,'Closing This Month')+card('ok',fc,'Fully Compliant')+card('rfi',rfis,'Open RFIs')+card('co',cosm,'COs Approved / Mo');
  document.getElementById('sumList').innerHTML = list.length ? list.map(pcardSummary).join('') : '<div class="empty">No projects match.</div>';
  // map pins (reflect selection — not the text search)
  MARKERS.clearLayers(); const pts=[];
  sel.forEach(r=>{ if(r.lat==null||r.lng==null) return; const cls=compClass(r);
    const m=L.circleMarker([r.lat,r.lng],{radius:7,color:'#fff',weight:1.5,fillColor:pinColor(cls),fillOpacity:.95});
    m.bindPopup('<b>'+esc(r.project)+'</b><br>'+esc(r.project_number)+' · '+esc(r.stage)+' · '+esc(r.sector)+'<br>'+esc(r.owner||'')+(r.contract_amount?'<br>'+money(r.contract_amount):'')+'<br><a href="'+pcOverview(r.procore_id)+'" target="_blank">Open in Procore</a>');
    m.addTo(MARKERS); pts.push([r.lat,r.lng]); });
  if(pts.length){ try{ MAP.fitBounds(pts,{padding:[30,30],maxZoom:11}); }catch(e){} }
  // ---- Financials tab ----
  renderFin(list);
}
function card(cls,n,label){ return '<div class="card '+cls+'"><div class="n">'+n+'</div><div class="l">'+label+'</div></div>'; }
function kv(k,v){ return '<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
/* Summary card — team / owner / schedule / compliance (no financials) */
function pcardSummary(r){
  const cls=compClass(r); const c=r.compliance;
  const compPill = c? (cls==='g'?'<span class="pill g">Compliant</span>':cls==='y'?'<span class="pill y">Expiring</span>':cls==='r'?'<span class="pill r">'+c.noncompliant+' non-compliant</span>':'<span class="pill n">—</span>') : '<span class="pill n">no compliance data</span>';
  const team=(r.team||[]).filter(t=>t.name).slice(0,8).map(t=>'<b>'+esc(t.name)+'</b>'+(t.role?' ('+esc(t.role)+')':'')).join(' &middot; ');
  const pid=r.procore_id; const s={project:pcOverview(pid),rfis:pcBase(pid)+'/tools/rfis'};
  return '<div class="pcard '+cls+'">'
    +'<div class="phead"><span class="pname"><a href="'+esc(s.project)+'" target="_blank">'+esc(r.project)+'</a></span><span class="pnum">'+esc(r.project_number)+'</span>'
    +'<span class="chip stage">'+esc(r.stage)+'</span>'+(r.sector?'<span class="chip '+(r.sector_code==='05'?'sp':'sect')+'">'+esc(r.sector)+'</span>':'')
    +(r.closing_this_month?'<span class="chip close">Closing this month</span>':'')
    +'<span class="pright">'+compPill+'</span></div>'
    +'<div class="pgrid">'
    +kv('Owner',esc(r.owner||'—'))+kv('Architect',esc(r.architect||'—'))
    +kv('Completion',esc(r.completion_date||'—'))
    +kv('Open RFIs',(r.rfis_open||0)+(r.rfis_open&&r.rfis_open_list&&r.rfis_open_list[0]&&r.rfis_open_list[0].link?' <a href="'+esc(r.rfis_open_list[0].link)+'" target="_blank" style="font-size:11px">view</a>':''))
    +kv('Office',esc(r.office||'—'))
    +kv('Address',esc(r.address||'—'))
    +'</div>'
    +(team?'<div class="team"><span class="pgrid"></span>Team: '+team+'</div>':'')
    +'<div class="srclinks"><a href="'+esc(s.project)+'" target="_blank">Procore project</a><a href="'+esc(s.rfis)+'" target="_blank">RFIs</a>'
    +(c?'<a href="https://compliance.baileyharris.com" target="_blank">Compliance ('+c.compliant+'/'+c.vendors+' ok)</a>':'')+'</div>'
    +'</div>';
}
/* Financials tab */
function renderFin(list){
  const totContract=list.reduce((a,r)=>a+num(r.revised_contract||r.contract_amount),0);
  const totAppr=list.reduce((a,r)=>a+num(r.approved_cos),0);
  const totBudget=list.reduce((a,r)=>a+num(r.budget_revised||r.budget_original),0);
  const over=list.filter(r=>r.budget_forecast&&r.budget_variance<0);
  const netVar=list.reduce((a,r)=>a+(r.budget_forecast?num(r.budget_variance):0),0);
  document.getElementById('finCards').innerHTML=
    card('total',money(totContract),'Total Contract (rev.)')
   +card('co',money(totAppr),'Approved Change Orders')
   +card('ok',money(totBudget),'Total Budget (rev.)')
   +card('soon',over.length,'Projects Over Budget')
   +card(netVar<0?'total':'ok',(netVar<0?'Over ':'Under ')+money(Math.abs(netVar)),'Net Budget Variance');
  document.getElementById('finVar').innerHTML = over.length
    ? '<div class="varbox"><b>&#9888; Over budget ('+over.length+')</b><div style="margin-top:7px;line-height:1.7">'
        +over.map(r=>'<a href="'+pcBase(r.procore_id)+'/tools/budgeting" target="_blank" style="color:#211E1E;text-decoration:none;font-weight:600">'+esc(r.project)+'</a> — <span class="fover">Over '+money(Math.abs(r.budget_variance))+'</span> <span style="color:#7a828f">(forecast '+money(r.budget_forecast)+' vs budget '+money(r.budget_revised||r.budget_original)+')</span>').join('<br>')
        +'</div></div>'
    : '<div class="varbox clean"><b>&#10003; No projects currently over budget</b> <span style="color:#7a828f">— based on forecast vs. revised budget on active jobs.</span></div>';
  document.getElementById('finList').innerHTML = list.length ? list.map(fcard).join('') : '<div class="empty">No projects match.</div>';
}
function fcard(r){
  const hasBud=!!r.budget_forecast;
  const overCls = hasBud ? (r.budget_variance<0?'o':'u') : '';
  const varCell = hasBud
    ? '<span class="'+(r.budget_variance<0?'fover':'funder')+'">'+(r.budget_variance<0?'Over ':'Under ')+money(Math.abs(r.budget_variance))+'</span>'
    : '—';
  const contract=num(r.revised_contract||r.contract_amount), budget=num(r.budget_revised||r.budget_original);
  const margin=(contract&&budget)?contract-budget:null;
  const marginCell = margin==null?'—':'<span class="'+(margin<0?'fover':'funder')+'">'+(margin<0?'-':'')+money(Math.abs(margin))+'</span>';
  const pid=r.procore_id; const s={contract:pcBase(pid)+'/tools/prime-contracts',budget:pcBase(pid)+'/tools/budgeting',project:pcOverview(pid)};
  return '<div class="pcard fin '+overCls+'">'
    +'<div class="phead"><span class="pname"><a href="'+esc(s.project)+'" target="_blank">'+esc(r.project)+'</a></span><span class="pnum">'+esc(r.project_number)+'</span>'
    +'<span class="chip stage">'+esc(r.stage)+'</span>'
    +(hasBud?'<span class="pright"><span class="pill '+(r.budget_variance<0?'r':'g')+'">'+(r.budget_variance<0?'Over budget':'Under budget')+'</span></span>':'')+'</div>'
    +'<div class="pgrid">'
    +kv('Contract','<span class="money">'+money(r.contract_amount)+'</span>')
    +kv('Approved COs','<span class="money">'+money(r.approved_cos)+'</span>')
    +kv('Pending COs','<span class="money">'+money(r.pending_cos)+'</span>')
    +kv('Revised Contract','<span class="money">'+money(r.revised_contract)+'</span>')
    +kv('Original Budget','<span class="money">'+money(r.budget_original)+'</span>')
    +kv('Revised Budget','<span class="money">'+money(r.budget_revised)+'</span>')
    +kv('Forecast','<span class="money">'+(hasBud?money(r.budget_forecast):'—')+'</span>')
    +kv('Budget Variance',varCell)
    +kv('Contract − Budget',marginCell)
    +kv('COs approved this mo',(r.cos_approved_this_month||0)+(r.cos_approved_this_month_amt?' · '+money(r.cos_approved_this_month_amt):''))
    +'</div>'
    +'<div class="srclinks"><a href="'+esc(s.contract)+'" target="_blank">Prime contract / COs</a><a href="'+esc(s.budget)+'" target="_blank">Budget</a><a href="'+esc(s.project)+'" target="_blank">Procore project</a></div>'
    +'</div>';
}
load();
</script>
</body>
</html>
